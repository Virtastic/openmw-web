# nginx config baked into the openmw-web image. Listens on plain HTTP:80; the shared
# reverse proxy (and Cloudflare) handle TLS. server_name is a catch-all because the proxy
# has already routed this request to this container by Host.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation on EVERY response — this is why openmw needs its own server,
    # not a plain bucket. Set here so it survives regardless of the shared proxy's config.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    # Defense-in-depth: a standalone game page, never meant to be framed or MIME-sniffed.
    add_header X-Frame-Options              "DENY"         always;
    add_header X-Content-Type-Options       "nosniff"      always;

    # Compress text at the origin; wasm/data are left raw and compressed by Cloudflare at
    # the edge (keeps CPU off this tiny shared box; cache-misses to origin are rare).
    gzip on;
    gzip_types application/javascript text/css image/svg+xml; # text/html is gzipped by default
    # NB: nginx 1.27's default mime.types already maps .wasm -> application/wasm. Do NOT add a
    # bare `types {}` block here — it REPLACES the whole map and breaks text/html etc.

    # Launcher is the landing page (production equivalent of OPENMW_LAUNCHER=1).
    location = / { try_files /launcher.html =404; }

    # Immutable engine artifacts: cache hard (Cloudflare + browser). Bump filenames or purge
    # the Cloudflare cache on each engine redeploy.
    location ~* \.(wasm|data|js)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
