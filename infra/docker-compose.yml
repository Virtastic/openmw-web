# openmw-web's slice of the shared box's stack. Drop this service into the box (or merge it
# into the box's compose project) so it joins the shared reverse-proxy network. The proxy
# routes Host -> this container:80; the container serves the COOP/COEP headers itself.
#
# Prereqs on the box (see SHARED-BOX-SETUP.md): a reverse proxy (Traefik shown) attached to
# an external docker network named "proxy". Create it once:  docker network create proxy
services:
  openmw:
    # Pull the prebuilt image published by CI (set OWNER to your GitHub org/user, lowercased):
    image: ghcr.io/OWNER/openmw-web:latest
    # ...or build locally instead of pulling (context is the repo root):
    # build:
    #   context: ..
    #   dockerfile: infra/Dockerfile
    restart: unless-stopped
    networks: [proxy]
    labels:
      # --- Traefik (label-based routing). Edit the Host() to your openmw domain. ---
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openmw.rule=Host(`play.example.com`)"
      - "traefik.http.routers.openmw.entrypoints=websecure"
      - "traefik.http.routers.openmw.tls=true"
      - "traefik.http.services.openmw.loadbalancer.server.port=80"
    # --- Alternative: jwilder/nginx-proxy instead of Traefik ---
    # environment:
    #   VIRTUAL_HOST: play.example.com
    #   VIRTUAL_PORT: "80"

networks:
  proxy:
    external: true
