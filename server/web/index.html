<!doctype html>
<!--

  SPDX-License-Identifier: GPL-3.0-or-later | part of openmw-web

  Everything this page loads is served from this server. No CDN, no external font, no
  analytics: an admin tool has to come up on a LAN with no route to the internet, and on
  the night something is broken the last thing that should also be broken is the page you
  fix it from. The icon font is vendored for the same reason.

  Structure follows AdminLTE's own layout, app-wrapper > app-header / app-sidebar /
  app-main, a content header carrying the page title, cards with real headers, and
  small-box widgets on the overview, rather than plain Bootstrap markup wearing AdminLTE's
  stylesheet, which is what this was before and why it looked nothing like the thing it is
  built on.
-->
<!-- Pinned dark, and pinned deliberately: this is the launcher's world, and the launcher is
     a dark product (near-black ash, warm parchment ink, bronze hardware). Following the OS
     preference would mean a light admin page sitting behind the same logo as a dark game,
     which is the mismatch app.css exists to end. Every colour is stated there rather than
     inherited, so the page holds on either host ground. -->
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OpenMW-Web admin</title>
<link rel="icon" href="/admin/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/admin/static/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="/admin/static/vendor/adminlte.min.css">
<link rel="stylesheet" href="/admin/static/app.css">
</head>
<!-- No bg-body-tertiary here: that utility is a class, so it outranks app.css's `body` rule
     and repainted the ground in Bootstrap's stock grey over the launcher's ash. The ground
     is set in app.css, where the rest of the palette lives. -->
<body class="layout-fixed sidebar-expand-lg">
<div class="app-wrapper">

  <!-- Top bar -->
  <nav class="app-header navbar navbar-expand">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle navigation">
            <i class="bi bi-list"></i>
          </a>
        </li>
        <li class="nav-item d-none d-md-flex align-items-center">
          <span class="navbar-text" id="topWorld"></span>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-2"><span id="topHealth"></span></li>
        <li class="nav-item me-2"><span id="topMaintenance"></span></li>
        <li class="nav-item dropdown" id="topUserWrap" hidden>
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown" href="#">
            <i class="bi bi-person-circle fs-5"></i>
            <span class="d-none d-sm-inline" id="topUser"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header" id="topRole"></h6></li>
            <li><a class="dropdown-item" href="#security"><i class="bi bi-shield-lock me-2"></i>My security</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" id="btnLogout"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="app-sidebar shadow">
    <div class="sidebar-brand">
      <a href="#overview" class="brand-link">
        <img src="/admin/static/logo.svg" alt="" class="brand-image opacity-75">
        <span class="brand-text fw-light">OpenMW-Web</span>
      </a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation" id="mainNav"></ul>
      </nav>
    </div>
  </aside>

  <!-- Content -->
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-sm-12">
            <h3 class="mb-0" id="pageTitle">Loading…</h3>
            <p class="text-secondary small mb-0" id="pageLead"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div id="banner"></div>
        <div id="view"></div>
      </div>
    </div>
  </main>

</div>

<!-- Confirmation dialog. Every destructive action routes through this one modal rather
     than each page inventing its own, so "are you sure" behaves identically everywhere. -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmTitle">Are you sure?</h5>
      </div>
      <div class="modal-body">
        <div id="confirmBody"></div>
        <div id="confirmTypeWrap" class="mt-3" hidden>
          <label class="form-label small" id="confirmTypeLabel"></label>
          <input class="form-control" id="confirmType" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmGo">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="/admin/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/admin/static/vendor/adminlte.min.js"></script>
<script src="/admin/static/vendor/qrcode-generator.js"></script>
<script src="/admin/static/app.js" type="module"></script>
</body>
</html>
