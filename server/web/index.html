<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OpenMW-Web admin</title>
<link rel="icon" href="/admin/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/admin/static/vendor/adminlte.min.css">
<link rel="stylesheet" href="/admin/static/app.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

  <!-- Top bar -->
  <nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle navigation">
            <span class="vt-burger" aria-hidden="true">☰</span>
          </a>
        </li>
        <li class="nav-item d-none d-md-block">
          <span class="navbar-text" id="topWorld">&nbsp;</span>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-2"><span id="topMaintenance"></span></li>
        <li class="nav-item me-3"><span class="navbar-text small" id="topUser"></span></li>
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-secondary" id="btnLogout" hidden>Sign out</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar -->
  <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand">
      <a href="#overview" class="brand-link">
        <img src="/admin/static/logo.svg" alt="" class="brand-image opacity-75">
        <span class="brand-text fw-light">OpenMW-Web</span>
      </a>
    </div>
    <div class="sidebar-wrapper">
      <nav class="mt-2">
        <ul class="nav sidebar-menu flex-column" id="mainNav" role="menu"></ul>
      </nav>
    </div>
    <div class="sidebar-footer small px-3 py-2 text-secondary" id="sidebarFooter"></div>
  </aside>

  <!-- Content -->
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <h3 class="mb-0" id="pageTitle">Loading…</h3>
        <p class="text-secondary small mb-0" id="pageLead"></p>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <div id="banner"></div>
        <div id="view"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="float-end d-none d-sm-inline" id="footVersion"></div>
    <strong>OpenMW-Web</strong> admin &middot; <a href="#help">help &amp; docs</a>
  </footer>
</div>

<!-- Confirmation dialog. Every destructive action routes through this one modal rather
     than each page inventing its own, so "are you sure" behaves identically everywhere. -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmTitle">Are you sure?</h5>
      </div>
      <div class="modal-body">
        <div id="confirmBody"></div>
        <div id="confirmTypeWrap" class="mt-3" hidden>
          <label class="form-label small" id="confirmTypeLabel"></label>
          <input class="form-control" id="confirmType" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmGo">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="/admin/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/admin/static/vendor/adminlte.min.js"></script>
<script src="/admin/static/vendor/qrcode-generator.js"></script>
<script src="/admin/static/app.js" type="module"></script>
</body>
</html>
