# Production compose for the openmw-mp multiplayer server on the shared OVH VPS.
# Deployed by .github/workflows/deploy-mp.yml to /opt/openmw-mp/docker-compose.prod.yml.
# Same house rules as the morrowind service: joins the shared `nostalgia` network and
# publishes NO host ports — only the shared edge Caddy reaches it (see deploy/openmw-mp.caddy).
services:
  openmw-mp:
    image: openmw-mp:ovh
    container_name: openmw-mp
    restart: unless-stopped
    networks:
      - shared
    volumes:
      # All persistent state (accounts, players, world, config.toml overrides, logs).
      # The deploy workflow never touches this dir's contents.
      - /opt/openmw-mp/data:/data
      # The operator's OWN game data, read-only. REQUIRED since 1.1.0: every world runs
      # a headless sim peer and the server refuses to boot without usable game data here.
      # Game data is bring-your-own and is never bundled or deployed by any workflow.
      - /opt/openmw-mp/gamedata:/data/gamedata:ro
    environment:
      - NODE_ENV=production
    # S3/locker credentials (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY — see
    # docs/PRODUCTION-BRINGUP.md §3). Lives under data/ because the deploy workflow never
    # touches that dir, same convention as the test server's /opt/openmw-mp-test/data/s3.env.
    # Optional so a fresh box still boots (the server then logs locker.s3_creds_missing at
    # error level and deploy-mp fails its gate — absent keys must never be silent again).
    env_file:
      - path: /opt/openmw-mp/data/s3.env
        required: false
    # Sized for gateway + worlds + sim peers: node processes (heap-capped) + one headless
    # sim peer (~310 MB measured with retail data) + slack. A runaway leak still trips
    # well before the box cares.
    mem_limit: 1536m
    # SIGTERM triggers a full persistence flush; give it time before SIGKILL.
    stop_grace_period: 30s
networks:
  shared:
    external: true
    name: nostalgia
