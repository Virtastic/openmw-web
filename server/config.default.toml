# openmw-mp default configuration. Do not edit this file — operator overrides live in
# <dataDir>/config.toml and are deep-merged over these defaults (scalars and arrays
# replace, tables merge key-by-key).

# Built-in plugins to load, in order. Available: "motd", "respawn", "death-penalty",
# "pvp", "sharing", "cell-reset", "admin".
# (Top-level key: in an override file it must appear before any [table] header.)
plugins = ["motd", "respawn", "death-penalty", "pvp", "sharing", "cell-reset", "admin"]

[server]
name = "OpenMW-Web server"        # shown in SessionHelloOk and /status
motd = "Welcome."                 # sent in SessionWelcome and as a server chat line on join
maxPlayers = 256
# THE SIM PEER'S CREDENTIAL, and nothing else — it is never checked against a player. `system`
# is a flag the CLIENT sets in SessionHello, so this is the only thing separating "I am the
# server's own simulator" from any registered account claiming to be. An EMPTY value refuses
# every system connection rather than skipping the check.
#
# GENERATED, not configured. Left empty, the server mints one on first start and keeps it in
# <dataDir>/peer-password, exactly as it does for the gateway token. Only two processes ever
# see this value, so making an operator invent one was a setup step with no upside and an
# obvious failure mode: skip it, and the world silently never simulates. Set it explicitly
# here if you would rather manage the secret yourself; a configured value always wins.
password = ""

[login]
allowRegistration = true          # false -> SessionRegister is refused (AUTH_FAILED)
inviteCode = ""                   # non-empty -> SessionRegister must carry a matching inviteCode
resumeWindowSec = 300             # M1 (reserved): how long a dropped session may resume via resumeToken
requireProfile = false            # true -> SessionReady is refused until email + username are set (ProfileSetup)
# The shipped client's ?mpauto=1 harness mode logs in with a FIXED, publicly known
# password. Leave false on anything reachable from the internet: it is a test affordance,
# not an auth method. The browser harness enables it on the servers it starts itself.
allowHarnessAuth = false

[integrations]
# Attio CRM capture: on profile completion the relay asserts a person record (email,
# username, signup date, consent). Empty apiKey = disabled, nothing is queued or sent.
attioApiKey = ""
attioBaseUrl = "https://api.attio.com"

[content]
# "names"  - M0: name+size+order must match the first player's manifest (session-canonical)
# "strict" - M1+: adds per-file sha256 (stubbed in M0, behaves like "names")
# "off"    - no manifest check
enforce = "names"

[engine]
# engineHash check: "warn" logs mismatches, "refuse" disconnects with BAD_ENGINE, "off" skips.
#
# In "refuse" mode a client that sends NO hash is refused too. That used to be a free pass —
# the guard read `mode === 'off' || hash === ''` — so anything could opt out of the check by
# declining to identify itself, and the only clients it actually caught were honest players on
# a stale build. "warn" still exempts an empty hash, because an unstamped local dev build
# legitimately sends one and warn's job is to report rather than to gate.
enforce = "warn"
# The 12-hex engine build THIS server serves (as stamped by wasm-build/version-engine.sh).
# Empty = adopt whichever build connects first, which is fine for answering "is this session
# consistent?" and wrong as a security control: on an empty server the first arrival defines
# the standard every later client is measured against. Set this when you build and serve the
# engine yourself — then the canonical build is something you STATED, and it survives the
# server emptying.
pin = ""

[rules]
# Where the respawn plugin sends the dead (M2). Defaults = the Example Suite demo's
# Village spawn point (the ?start=Village drop, verified by scenario s22); operators
# hosting other content override these in <dataDir>/config.toml.
respawnCellKey = "26,25"
respawnX = 216831.0
respawnY = 204909.0
respawnZ = 513.0
# Death penalty applied by the death-penalty plugin: "none" (M2 default; hook is a
# documented no-op seed for operators/plugins to extend).
deathPenalty = "none"
# M5: player-vs-player. false -> the pvp plugin drops CombatHit/CombatSpellHit aimed at
# players (actor targets are unaffected). Swap the plugin for faction/team rules.
pvp = false
# Phase 3 zoning (only consulted when pvp = true). "all" keeps M5 behaviour; "wilderness"
# allows it in exteriors only, minus safeCells, and never indoors — so towns, shops and
# guildhalls stay places you can stand still in. Party members never hit each other.
pvpZone = "all"
safeCells = []
# Chat scope for plain say. Default "world": four friends spread across Vvardenfell must
# be able to talk, and that is what a self-hosted server almost always is. A CROWDED
# public deployment sets "proximity", where shouting across the province is exactly what
# makes the chat box unreadable. "!" always sends global, "@" always sends to your party.
sayScope = "world"
# Resting advances the shared clock for EVERYONE, so who may do it is a world rule.
# "anyone" (default, and right for a co-op session), "party" (only a leader decides for
# the group), "off" (a public world: one stranger must not fast-forward a hundred people
# into the night).
timeSkip = "anyone"
# Phase 4: scale hostile NPCs to the party members standing WITH you (sub-linear, because
# a group's real advantage is action economy rather than raw numbers). A solo player is never
# affected: the rule keys on co-present members beyond the first.
#
# OFF BY DEFAULT, which is a deliberate reversal. The scaling model itself is sound — Valheim
# under-scales and co-op goes trivial, V Rising over-scales and its top complaint is that
# bosses are harsher with friends than solo — but Morrowind is not balanced for either, and
# what people actually come to co-op for is to play it TOGETHER, not to have it silently made
# harder because a friend walked in. A group that wants the challenge turns it on; a group
# that gets it without asking has no idea why the mudcrab took four hits.
#
# The party loot rules (gold split on, roll-on-rare off) are unaffected and stay on — the
# leader toggles those separately.
partyScaling = false
# Difficulty is surfaced in SessionWelcome.flags and applied CLIENT-side, in the victim's
# own combat pipeline (the server never computes damage). Morrowind scale: -100..100.
difficulty = 0

[sharing]
# M6 per-family sharing policy, enforced by the `sharing` plugin (swap it to implement
# party/faction-scoped rules). true = relay to everyone and keep one shared copy;
# false = "individual" mode, stored per-player and never relayed.
journal = true
questVars = true      # MWScript globals (the time globals are owned by M7, never here)
factions = true
crime = true
map = true            # M7 WorldMapExplored; the toggle exists now so operators see it
# Quest ids whose journal index may legitimately go DOWN (some MW quests regress).
# Everything else is arbitrated monotonic-max: a lagging client can never rewind a quest.
regressAllowlist = []
# Phase 4. Quest globals are CHARACTER-SHADOWED by default (stored per character, never
# relayed) — relaying them makes two party members at different stages overwrite each
# other forever. Only globals describing the WORLD are shared; add total-conversion ones
# here.
#
# partyCredit IS GONE, not merely defaulted off. It advanced co-present party members' OWN
# journals, which the instance-owned model forbids outright: one log per world, and it belongs
# to that world's owner (core/quests.ts). The implementation was deleted; the knob outlived it
# and was still parsed and documented here while nothing read it, and CHANGELOG 1.1.0 went on
# advertising the feature. A setting that does nothing is worse than a missing one — it reads
# as a promise. Setting it now is simply ignored, as any unknown key is.
worldGlobals = []

[locker]
# Accept an upload whose sha256 is unknown but whose name and size match a known retail file
# within a tolerance, backed by a header sniff of the uploaded bytes. true because legitimate
# retail distributions differ; set false to accept ONLY exact hashes from vanilla-manifest.json.
acceptByNameAndSize = true
# Storage locker: a player uploads their own Morrowind data once, streams it back on any
# device. S3-compatible (AWS, Cloudflare R2, Backblaze, MinIO). Credentials come from the
# env (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY) so they stay out of config files. An empty
# endpoint falls back to a folder on THIS server (<dataDir>/locker-blobs) instead.
endpoint = ""                     # e.g. https://<accountid>.r2.cloudflarestorage.com
region = "auto"                   # R2 uses "auto"; AWS uses the bucket region
bucket = ""
maxBytesPerAccount = 6442450944   # 6 GiB — Morrowind GOTY + a few mods
# Only used by the filesystem fallback: the origin a BROWSER reaches this server on, which
# is what upload/download URLs are built from. Wrong or empty and the browser cannot reach
# the URLs the server hands it (the server itself still can). Set it whenever there is no
# S3 endpoint and players are not on this machine.
publicBase = ""                   # e.g. https://mp.example.com
# Server-side savegames, a separate budget from the game-data library above: a full library
# must never be the reason a player cannot save. 512 MiB is many .omwsave slots.
maxSaveBytesPerAccount = 536870912

[economy]
# Public-realm rule: unique/named NPCs respawn there (the world is stateless), so their
# corpses must drop nothing or every reset mints artifacts. Off for private/party
# campaigns, which keep vanilla loot. Classification comes from content-table.json.
noDrop = false
# Refuse a drop of an item the sender does not hold, rather than only counting it as an
# anomaly. This became answerable once clients started reporting acquisitions per event
# (PlayerItemAcquired): before that the server's picture of an inventory was up to 2 s stale,
# which is exactly long enough for "pick up, then drop" — ordinary play — to look like a drop
# of something you never had. Enforcement was implemented on that stale picture once and
# backed out for precisely that reason.
#
# OFF by default: the credit path is only as complete as the client reporting it, so leave this
# off until the browser scenarios have exercised every acquisition path against a real engine.
# Account-level containment is unaffected and remains the working defence meanwhile.
refuseUnownedDrops = false

[limits]
msgsPerSec = 60                   # per-session message token bucket (burst = rate)
moveMsgsPerSec = 40               # separate budget for the player's OWN PlayerMove frames; bypasses msgsPerSec
# Cell actor authority: the holder simulates every NPC in its cell and streams ActorMoveBatch
# for everyone else, ON TOP of its own pose. Sharing one budget meant the busiest, most
# useful client tripped the limit first — so the actor stream gets its own. Nominal is 15 Hz;
# 60 leaves room for a hitching client catching up and for a re-broadcast after a handoff.
actorMoveMsgsPerSec = 60
bytesPerSec = 65536               # per-session sustained byte rate
# Burst ceiling for the byte bucket. Entering a dense cell sends the cell's state in one go,
# which is legitimately spiky; with burst == rate that spike disconnected a real player with
# "byte rate limit exceeded" mid-tutorial. Sustained throughput is still bytesPerSec.
bytesBurst = 262144               # 4x rate
# Outbound backpressure. `ws` queues bytes a client has not read in SERVER memory with no
# ceiling, so in a crowded cell one stalled reader grows RSS for everyone. Past the soft
# limit only LOSSY frames (movement / actor batches) are dropped — a stale pose is corrected
# by the next one; chat, journal and object ops are never shed. Past the hard limit the
# session is dropped: a client that cannot drain 1 MB is not playing. Two keys rather than a
# multiplier so an operator can widen the shed window without also widening the kill window.
maxBufferedBytes = 262144         # 256 KB ~= 4 s of the byte budget
maxBufferedBytesHard = 1048576    # 1 MB
maxConnsPerIp = 3
# Non-adjacent EXTERIOR cell changes allowed per minute, per player. 0 disables.
#
# The speed envelope deliberately forgives a cell change, because a door is a teleport — which
# leaves declaring cell changes as the way around it. The server ships no game data and cannot
# tell a real door from an invented one, but it does not need to: walking is always into an
# ADJACENT exterior cell, and a door goes through an interior. An exterior-to-exterior jump
# across the grid is a teleport spell, a silt strider, or a lie.
#
# Legitimate ones are rare (Recall and Intervention cost magicka and have somewhere to be), so
# this bounds the rate rather than refusing the act. Six a minute leaves a real player alone and
# makes map-hopping useless. Enforced in the shared lobby; counted everywhere else.
farTravelPerMin = 6
maxMsgBytes = 262144              # ws maxPayload; larger frames drop the socket
# SessionHello deadline. Generous on purpose: the browser client opens its socket from Lua,
# but Hello can only be sent on the next Lua tick — and while the engine streams game data
# and loads the world, ticks can stall for tens of seconds. At 10s a retail client was
# reliably refused with BAD_PROTO before it ever spoke. This still reaps dead sockets; it
# just doesn't punish players with big load orders or slow connections.
helloTimeoutMs = 45000
loginPerMinPerIp = 5              # auth attempts (Register+Login) per IP per minute
# Trust CF-Connecting-IP as the client's address, when it arrives from a private (proxy) peer.
# OFF by default. Turn it on ONLY where Cloudflare genuinely terminates in front of this server
# AND the edge deletes any client-supplied copy (see the header_up lines in deploy/Caddyfile).
# Wrong in either direction is silent: on with a leaky edge lets any client name its own
# address and reset its own rate limit, evade an IP ban and evade maxConnsPerIp; off behind
# Cloudflare makes every player share the edge's address, which collapses every per-IP limit
# into one global bucket. The mode is logged at boot as net.client_ip_mode.
trustCloudflareIp = false
maxHitDamage = 1000               # M5 sanity bound on relayed damage/effect magnitudes (not balance)

# Interest management + level of detail. Cell-granular visibility alone makes one busy cell
# an N x N pose mesh, and at 64 co-located players the binding constraint is CLIENT cost —
# every tab renders and interpolates 63 avatars plus the NPCs — not bandwidth. These knobs
# cut what each client has to draw and process. Distances are Morrowind world units
# (1 exterior cell = 8192). All of it applies to EXTERIOR cells only: interiors stay
# cell-granular, because there "too far to matter" is an occlusion question, not a distance
# one, and a radius tuned for open terrain would pop peers standing one wall away.
interestRadius = 12288            # 1.5 cells: beyond this a peer leaves your view. 0 = no culling
# The band a player must re-cover to flip state. Enter at interestRadius, leave only past
# interestRadius + this. Equal thresholds would make anyone walking the line spawn and
# despawn on alternate ticks in every other client.
interestHysteresis = 2048
# Nearest-K floor: the K closest peers stay in view whatever the radius says, so culling can
# never make someone feel alone in a crowd.
interestMinPeers = 12
# Send rate by distance. The client interpolates with a 100 ms render delay, so a lower rate
# for distant players costs almost nothing visually. Also tiers the holder's ActorMoveBatch
# stream — a distant player does not need 15 Hz NPC updates either. Rates are rounded to a
# whole number of 66 ms ticks (15/5/1 Hz -> every 1st/3rd/15th).
lodNearRadius = 4096              # <= this: near tier
lodMidRadius = 8192               # <= this: mid tier; beyond it, far tier (until interestRadius)
lodNearHz = 15
lodMidHz = 5
lodFarHz = 1
# How hard clients degrade DISTANT AVATARS (players), reusing the radii above so a puppet
# updated at 1 Hz is never also asked to walk smoothly:
#   "tiered" - near avatars are fully simulated; mid/far stop driving the character
#              controller and are repositioned instead. Everyone stays visible.
#   "full"   - every avatar fully simulated regardless of distance (pre-G2 behaviour).
#              Costs ~1.3 ms of client frame time per co-located avatar; kept as the
#              control for capacity measurements.
renderLod = "tiered"
# Hard ceiling on how many avatars a client fully simulates, whatever the radius says.
# 0 disables the cap. The radius alone does not bound cost in the case that matters: in a
# tight crowd everyone is inside the near radius, so everyone stays fully simulated and
# frame time scales with the crowd again. With the cap, worst-case client cost is
# lodNearMaxAvatars * ~1.2ms + (everyone else) * ~0.06ms, independent of clustering.
# 12 keeps a co-located 64 inside a 30fps budget; raise it for small co-op sessions where
# fidelity matters more than headroom.
lodNearMaxAvatars = 12

[time]
# M7: the server owns the clock. Morrowind scale = 30 (30 game seconds per real second);
# 0 freezes time (it then only moves on a WorldTimeRequest, i.e. resting/waiting).
# The calendar itself (hour/day/month/year) persists in world/global.json across restarts;
# this value is operator truth and is re-applied on every boot.
scale = 30

[gui]
# M7: how long a server-pushed GuiMessageBox/GuiInputDialog/GuiListBox waits for a reply
# before the plugin's promise settles as unanswered. A disconnect settles it immediately.
timeoutSec = 60

[cellReset]
# M7: cells wiped on a schedule by the `cell-reset` plugin (loot/containers/doors/objects
# return to their content-file state and clients are told to reload). Empty = no resets.
cells = []
intervalSec = 259200              # 3 days; only applies to the cells listed above
# SHARED LOBBY ONLY (ignored in private, party and standalone worlds). Seconds between wiping
# the cells the lobby has accumulated deltas for — i.e. everything strangers have dropped and
# left. `cells` above cannot cover this: it needs an explicit list, and nobody can enumerate the
# cells of a game the server has no data for.
#
# Safe only because the lobby persists nothing: an item on its ground could never have become
# anyone's property. Never enable an equivalent in a world where loot can leave. Cells with
# players standing in them are skipped, and a reset re-sends the restored cell to whoever is
# there rather than kicking them. 0 disables.
litterSweepSec = 3600

# DEV/TEST ONLY. Fake players that auto-accept friend requests and party invites, so the
# social flows can be exercised (and recorded) without a second human. They take real roster
# slots and write real friend/party rows, so a server strangers can reach must leave this at
# 0 — otherwise you are hosting accounts nobody controls. OMW_DEV_BOTS=<n> enables it for a
# single throwaway run without editing this file; the server logs a warning while any are up.
[dev]
bots = 0
# The handles they wear, consumed in order — real-looking names, because "Bot1" standing in
# town reads as scaffolding in a screenshot. Anything past the end of this list falls back to
# botPrefix + n. A name that is not a valid public handle (letters and digits, 3-20) is
# skipped with a warning rather than producing a bot with no handle.
botNames = ["Kestrel", "Talvyn", "Sable", "Ferrun", "Nyra", "Orin", "Vesk", "Draleth"]
botPrefix = "Bot"
# What the bots look like. These are CONTENT record ids, so there is no safe universal
# default — a wrong one spawns a broken puppet, which is worse than none. Leave them empty and
# the bots are social-only: real accounts, real characters, standing in the starter village,
# but no puppet in the world. For retail Morrowind, values that are known to work:
#   botRace = "dark elf"
#   botHead = "b_n_dark elf_m_head_01"
#   botHair = "b_n_dark elf_m_hair_01"
#   botClass = "acrobat"
# PER-BOT looks, one entry per bot, cycled if there are more bots than entries. This is what
# makes a group of bots read as several people rather than one person repeated: without it every
# bot shares botRace/botHead/botHair/botClass below and they are identical clones.
# Each entry is "race|head|hair|class". Sex is taken from the head id (which encodes _m_ or
# _f_), so the body can never contradict the head. Same caveat as below: these are CONTENT
# record ids and a wrong one spawns a broken puppet, so only list ids your game data has.
# Values verified present in retail Morrowind.esm:
#   botLooks = [
#     "dark elf|b_n_dark elf_f_head_01|b_n_dark elf_f_hair_01|healer",
#     "breton|b_n_breton_f_head_01|b_n_breton_f_hair_01|mage",
#     "imperial|b_n_imperial_m_head_01|b_n_imperial_m_hair_00|agent",
#   ]
botLooks = []
botRace = ""
botHead = ""
botHair = ""
botClass = ""

[admin]
# M8: accounts promoted to rank 3 (owner) on every boot, so the first operator never has
# to hand-edit accounts/<name>.json. Ranks: 0 player, 1 moderator (kick/tp/tpto),
# 2 admin (ban/unban/ipban/give/motd), 3 owner (setrank/console).
owners = []
# /console ships arbitrary Lua to a player's OWN machine. Owner-only even when true, and
# every use is logged with actor, target and the full payload. Set false to remove the
# capability from the server entirely.
allowConsole = true
# Bearer token for the web admin dashboard at /admin (live worlds, players, anomaly
# counters, report queue, kick/ban/mute/broadcast). Empty = the dashboard is not served at
# all, which is the right default: the in-game panel already covers a self-hosted world.
dashboardToken = ""

[moderation]
# A4: durable chat log + /report inbox under <dataDir>/logs and <dataDir>/reports.
# Public play needs evidence an admin can read after the fact; stdout is not that (it is
# level-filtered and rotated by the supervisor). See PRIVACY.md — this is personal data.
chatLog = true
# Days of chat logs and reports to keep. Matches the documented backup retention (README).
# 0 = prune everything older than today, i.e. effectively keep only the current day.
retentionDays = 14
# How many recent chat lines are attached to a /report as context. This is what an admin
# actually needs: a reason with no surrounding conversation is not actionable.
contextLines = 20

[authority]
# Cell actor authority: ONE connection per cell simulates every NPC there and streams
# ActorMoveBatch to the rest. That connection is ALWAYS the sim peer — never a player. A
# player's browser does not simulate NPCs for anyone else, so there is no election, no
# fitness scoring and no handoff: the peer holds every cell it occupies, and a cell it has
# not reached waits for it.
rttProbeSec = 5        # ping cadence; ~6 B/s/player. The 50 s keepalive deadline is unchanged.
reviewSec = 10         # how often a held cell is checked for liveness (cheap: a scan)
# The peer has held a cell with NPCs in it this long without producing a single actor frame:
# it is not simulating. Reported loudly (authority.silent_peer) and left holding the cell —
# there is nobody to hand it to, and revoking would remove the NPCs as well as freeze them.
actorSilenceSec = 15

[metrics]
# Prometheus text-format scrape endpoint at GET /metrics. OFF by default: the numbers are
# operational (player counts, auth failures, latency) and the endpoint is not something a
# public listener should expose by accident.
enabled = false
# Required bearer token: scrapers must send `Authorization: Bearer <token>`. An empty
# token disables the endpoint even when enabled = true — there is no unauthenticated mode.
# While disabled the route answers 404, exactly like any other unknown path, so a prober
# cannot tell that this server has metrics at all.
token = ""

[setup]
# Written by the admin dashboard's setup wizard, and read back by it. Not settings in the
# usual sense — they record what you told the wizard, so it can show you where you got to
# on a different machine or after a restart. Safe to edit or delete; the worst that happens
# is the dashboard offers to walk you through setup again.
completed = false
# "morrowind", "expansions" or "tamriel-rebuilt" — which files the wizard checks for.
contentProfile = ""
# "public" or "internal". Informational: HTTPS itself is configured in .env, outside the
# server, because the proxy that terminates it is a different container.
hosting = ""
# "single" or "multiplayer". The wizard's pivot answer — the dashboard reads it back to hide
# multiplayer-only pages and settings from a single-player deployment.
deploymentMode = ""
# "verify" (players bring their own files) or "serve" (this server provides them).
deliveryModel = ""
# "local" or "s3" — where uploaded files live.
storage = ""
# Which sign-in methods the wizard enabled, e.g. ["password", "discord"].
loginMethods = []

[notifications]
# Outgoing mail and webhooks. ENTIRELY OPTIONAL: with no smtpHost set, nothing is ever sent,
# nothing fails, and the dashboard simply does not offer password recovery — an operator who
# never configured mail should not see a "forgot password" link that quietly does nothing.
#
# Two things use this:
#   1. Password recovery for dashboard accounts. Single sign-on accounts do not need it —
#      the identity provider already owns their recovery.
#   2. Telling you something happened while you were not watching (see `events`).
#
# Credentials here are your real mail account. They are stored like every other secret: the
# dashboard masks them and never sends them back to a browser.
smtpHost = ""
# 465 uses TLS from the first byte; anything else (587, 25) upgrades with STARTTLS and is
# REFUSED if the server does not offer it. Plaintext submission is never attempted.
smtpPort = 587
smtpUser = ""
smtpPass = ""
# Envelope sender. Many providers require this to match the authenticated account.
from = ""
# Where operational notifications go. Password resets always go to the account's own address.
to = ""
# Posted as {"text": "...", "event": "...", ...} — the shape Slack, Discord and Mattermost
# all accept. Empty disables webhooks.
webhookUrl = ""
# Which structured log events raise a notification. These are the ones worth waking up for:
# a config rollback means a save did not survive a restart, and the rest are actions with
# consequences for a real person. Add any event name the server logs.
events = [
  "admin.config_fallback",
  "admin.console",
  "admin.account_deleted",
  "admin.maintenance",
]

[auth]
# Phase B: single sign-on ALONGSIDE the account+password path, never instead of it.
# Flow: Authorization Code + PKCE (S256), with the code->token exchange done HERE, on the
# server, holding the client secret (a Backend-For-Frontend). The provider's access/refresh
# /ID tokens never reach the browser and never enter the WebSocket protocol; the browser
# only ever receives a one-time, 60-second login ticket. Implicit flow is not implemented
# and will not be (RFC 9700 s2.1.2 deprecates it).
# Accounts are keyed on (issuer, subject). NEVER on email: email is mutable and providers
# re-assign it, so keying on it would hand one player's character to another. No email
# scope is requested at all.
# SSO-only: the hosted multiplayer product requires it (a persistent cross-world character
# needs a durable identity). When true, account+password register/login are refused and
# only the SSO ticket path is accepted; the shipped launcher does SSO exclusively. A
# self-hoster who wants passwords sets this false AND allowPasswordLogin true.
requireSso = false
allowPasswordLogin = true
# Where the callback sends the browser back to — your game page. The result arrives in the
# URL FRAGMENT (#mpticket=..., #mperror=..., #mplink=...) so it is never logged, cached or
# sent in a Referer. Required as soon as any provider below is enabled. A `return`
# parameter from the caller is ignored: this server is not an open redirector.
returnUrl = ""

# Per provider: register `redirectUri` with the provider EXACTLY as written here.
#   discord   -> https://discord.com/developers/applications  (OAuth2 -> Redirects)
#   google    -> https://console.cloud.google.com/apis/credentials  (OAuth client, type "Web")
#   microsoft -> https://entra.microsoft.com  (App registrations -> Authentication -> Web)
#   custom    -> any OIDC issuer (Keycloak, Authentik, Auth0...); `issuer` is REQUIRED and
#                must serve /.well-known/openid-configuration.
# `issuer` overrides the well-known issuer (leave "" for the three named providers).
# `scope` overrides the default ("identify" for Discord, "openid profile" otherwise).

[auth.discord]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.google]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.microsoft]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.custom]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

# Phase H — on-demand headless simulation peer.
# A real (rendering-disabled) OpenMW that connects like a client and holds cell authority,
# so NPCs are simulated on the operator's machine instead of in a player's browser. This is
# what stops a modified client authoring NPC state for everyone else.
# OFF by default: it needs a native openmw binary AND game data on the server, which a
# self-hoster may not have. With it off, the existing client-authority election is unchanged.
[simPeer]
# The sim peer is MANDATORY and always on: it is the only thing permitted to simulate NPCs,
# so there is no mode to choose. A server that cannot run one refuses to boot rather than
# starting a world whose NPCs never move. It needs game data in <sharedDir>/gamedata, a
# headless openmw binary, and [server].password (its only credential).
binary = ""                       # absolute path to the headless-capable openmw
configDir = ""                    # its own --config dir (isolated openmw.cfg + settings.cfg)
userDataDir = ""                  # its own --user-data dir
startCell = "Seyda Neen"
# Hard ceiling on peers IN THIS WORLD PROCESS. In practice that is one: server.ts calls
# ensure() with a single key ('world'), because one peer covers every occupied cell in the
# world through its ANCHOR LIST (mwmp setSimAnchors) rather than by standing in them.
#
# The older "one peer per 3x3 block, so this is the number of separated player groups" note
# was from the pre-anchor design and is wrong twice over: movement.ts loadedCells() returns
# ONE PEER SIMULATES ONE CELL. OpenMW clamps actor processing to 7168 units and an exterior
# cell is 8192 wide, so an engine only ticks actors near where it STANDS -- anchoring makes it
# load a cell, not simulate it. The server therefore runs one peer per OCCUPIED CELL, and this
# cap is what bounds that.
#
# READ THIS AS THE PLAYER CEILING IT IS: the number of cells that can be simulated at once, not
# the number of players. Players sharing a cell share its peer and cost nothing extra, so a
# hundred people in Balmora need one peer; ten people in ten corners of Vvardenfell need ten.
# Cells past the cap are held but NOT ticked, and the server says so once per change with
# simpeer.cells_unsimulated -- frozen NPCs and melee that does not land, for whoever is there.
#
# THIS IS NOT THE PLATFORM'S MEMORY GOVERNOR — it cannot be, because it is per world process
# and cannot see its siblings. N worlds does NOT mean N peers: each world runs one peer per
# OCCUPIED CELL, so N worlds means N x (however many cells their players are spread across).
# That is why the gateway budgets on the peer count worlds actually report rather than on a
# fixed price per world -- see [worlds] peerCostMb. This stays as a per-world backstop.
# MEASURED 487 MB RSS with full retail Morrowind + Tribunal + Bloodmoon, headless on Linux,
# anchoring one exterior cell (2026-08-24, host load 1.4). Startup to SessionHello was 11.4 s
# with that data set, which is why [simPeer] startTimeoutMs is generous. A peer anchoring
# several busy cells will cost more.
# 0 = UNLIMITED, and that is the right default. A peer is not a luxury to ration: it is what
# makes the cell a player is standing in simulate at all. Capping peers does not shed load, it
# hands whoever is in the uncovered cell frozen NPCs and melee that never lands, while every
# health check and log line still reads green. There is no graceful degradation available here.
#
# Run out of capacity at world CREATION instead -- that path refuses with platform_full and the
# player is told. A world that exists must simulate all of itself.
#
# Each peer measured 487 MB RSS with full retail data and about 20% of a core while busy, so
# size the HOST for the cells you expect to be occupied at once (see [worlds] memBudgetMb).
# Setting a finite number here is a deliberate risk, and the server logs simpeer.at_cap as an
# ERROR when it bites, because somebody is playing an unsimulated cell at that moment.
maxPeers = 0
idleReapMs = 120000               # reap a peer whose world has had no humans this long
startTimeoutMs = 120000           # retail data load is slow; generous, and failure is non-fatal
restartBackoffMs = 15000          # after a crash, wait before respawning (no hot crash loop)

# F3 supervisor sizing. Read by the GATEWAY process (dist/gateway.mjs) only; a single world
# server ignores this table entirely.
#
# Every occupied world is a node process AND its own sim peer, so worlds multiply RAM rather
# than sharing it. A count cap cannot see that, which is why there is a memory budget: the
# gateway takes the LOWER of the two ceilings and logs which one bound it (gateway.capacity).
[worlds]
# Offer the shared PUBLIC world at all? OFF by default, deliberately.
#
# Public is the most experimental surface in multiplayer: strangers rather than friends, lobby
# containment holding inventory back from real characters, zoned PvP, and server-side movement
# correction that ACTS rather than merely counting. Every one of those is fine in a party of
# friends and unproven against people you did not invite.
#
# With this off the gateway starts no public world and the directory lists none, so the client's
# Worlds tab has nothing to show and the "Public" button disappears on its own -- there is no
# second switch to remember. Turn it on when you want the shared world open.
publicEnabled = false
# 0 = derive the count ceiling from [server] maxPlayers (one solo world per seated player).
maxWorlds = 0
# Total RAM the gateway may spend on worlds and their peers. 0 DISABLES the memory governor
# and leaves only the count cap — which is how a 1.5 GB container was allowed to try to run
# 256 worlds. Set it to the container's limit, measured on the host you actually deploy to.
# 8192 = the mem_limit in docker-compose.prod.yml. This was 0 -- the governor OFF -- and the
# comment above says exactly what that cost: a 1.5 GB container permitted to attempt 256 worlds.
# Leaving it off is worse now than it was, because each world may run several peers rather than
# one. Set it to YOUR container's limit if that is not 8g.
memBudgetMb = 8192
# MEASURED cost of one occupied world: its node process plus its sim peer.
#
# 640 comes from a real measurement, not an estimate: 623 MB total (sim peer 487 MB + world
# process 136 MB), stable across three samples 20 s apart, on Linux/x86-64 with full retail
# Morrowind + Tribunal + Bloodmoon and one player anchoring one exterior cell, host load 1.4.
# Rounded up for headroom. The previous value of 780 was a guess assembled from two figures in
# comments and was wrong in both halves — the node process is far smaller and the peer larger.
#
# Re-measure on YOUR host with YOUR game data: server/scripts/measure-capacity.ts. A peer
# anchoring several busy cells will cost more than one standing in Seyda Neen.
worldCostMb = 640
# MEASURED cost of each ADDITIONAL sim peer a world runs, beyond the first.
#
# 487 is the peer half of the measurement above (sim peer 487 MB + world process 136 MB), so
# this is the same sample, not a second guess.
#
# THIS EXISTS BECAUSE worldCostMb STOPPED BEING A WHOLE ANSWER. It was measured when a world
# ran exactly one peer, so a world was a fixed 640 MB and the governor could turn a budget into
# a world count once at boot. A world now runs ONE PEER PER OCCUPIED CELL: four players in four
# cells is four engines, about 2100 MB, and a governor still pricing that world at 640 permits
# roughly three times the RAM the box has. That is the exact OOM this governor was written to
# prevent, reintroduced underneath it by a change one layer down.
#
# The ceiling therefore MOVES as players spread out, which is correct -- that is when the host
# actually fills. Set to 0 to price every world at worldCostMb regardless of how many peers it
# runs; that is the old arithmetic, and it is only safe if your worlds never exceed one peer.
peerCostMb = 487
# Held back for the gateway process itself before worlds are budgeted. Measured at 118 MB with
# one world supervised; 256 leaves room for the directory, the SSO front door and the locker.
gatewayReserveMb = 256

# F3 — the world directory this world's players can browse from the in-game Social menu.
# Empty means no gateway: the Worlds tab says so and everything else works normally, which
# is the right experience for a single self-hosted world.
[gateway]
url = ""
# How a WORLD PROCESS proves to the gateway that it is part of the platform rather than a
# client. The gateway takes the account from the caller's identity and never from the message
# body, because a client-supplied account made the per-owner world cap decorative -- one caller
# could fabricate a name per request and exhaust every world slot on the host. A world server
# has no locker session to present, so this credential is the only way it can create a world on
# a player's behalf; without it, creating a session from inside the game is refused.
#
# LEAVE THIS EMPTY. It generates itself: on first load a random credential is written to
# `gateway-token` in the shared dir, which the gateway and every world it spawns already read,
# so both halves agree without anyone pasting anything. Requiring an operator to invent one
# meant the feature was silently dead on any deployment that forgot.
#
# Set it only if you want to manage the secret yourself -- an explicit value always wins.
serverToken = ""
