# openmw-mp default configuration. Do not edit this file — operator overrides live in
# <dataDir>/config.toml and are deep-merged over these defaults (scalars and arrays
# replace, tables merge key-by-key).

# Built-in plugins to load, in order. Available: "motd".
# (Top-level key: in an override file it must appear before any [table] header.)
plugins = ["motd"]

[server]
name = "openmw-mp"                # shown in SessionHelloOk and /status
motd = "Welcome to openmw-mp."    # sent in SessionWelcome and as a server chat line on join
maxPlayers = 16
password = ""                     # non-empty -> Register/Login must carry a matching serverPassword

[login]
allowRegistration = true          # false -> SessionRegister is refused (AUTH_FAILED)
inviteCode = ""                   # non-empty -> SessionRegister must carry a matching inviteCode
resumeWindowSec = 300             # M1 (reserved): how long a dropped session may resume via resumeToken

[content]
# "names"  - M0: name+size+order must match the first player's manifest (session-canonical)
# "strict" - M1+: adds per-file sha256 (stubbed in M0, behaves like "names")
# "off"    - no manifest check
enforce = "names"

[engine]
# engineHash check against the first player's hash (adopt-first, like content):
# "warn" logs mismatches, "refuse" disconnects with BAD_ENGINE, "off" skips.
enforce = "warn"

[limits]
msgsPerSec = 60                   # per-session message token bucket (burst = rate)
bytesPerSec = 65536               # per-session byte token bucket (burst = rate)
maxConnsPerIp = 3
maxMsgBytes = 262144              # ws maxPayload; larger frames drop the socket
helloTimeoutMs = 10000            # SessionHello must arrive within this window
loginPerMinPerIp = 5              # auth attempts (Register+Login) per IP per minute
