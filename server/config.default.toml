# openmw-mp default configuration. Do not edit this file — operator overrides live in
# <dataDir>/config.toml and are deep-merged over these defaults (scalars and arrays
# replace, tables merge key-by-key).

# Built-in plugins to load, in order. Available: "motd", "respawn", "death-penalty",
# "pvp", "sharing", "cell-reset", "admin".
# (Top-level key: in an override file it must appear before any [table] header.)
plugins = ["motd", "respawn", "death-penalty", "pvp", "sharing", "cell-reset", "admin"]

[server]
name = "openmw-mp"                # shown in SessionHelloOk and /status
motd = "Welcome to openmw-mp."    # sent in SessionWelcome and as a server chat line on join
maxPlayers = 16
password = ""                     # non-empty -> Register/Login must carry a matching serverPassword

[login]
allowRegistration = true          # false -> SessionRegister is refused (AUTH_FAILED)
inviteCode = ""                   # non-empty -> SessionRegister must carry a matching inviteCode
resumeWindowSec = 300             # M1 (reserved): how long a dropped session may resume via resumeToken
requireProfile = false            # true -> SessionReady is refused until email + username are set (ProfileSetup)

[integrations]
# Attio CRM capture: on profile completion the relay asserts a person record (email,
# username, signup date, consent). Empty apiKey = disabled, nothing is queued or sent.
attioApiKey = ""
attioBaseUrl = "https://api.attio.com"

[content]
# "names"  - M0: name+size+order must match the first player's manifest (session-canonical)
# "strict" - M1+: adds per-file sha256 (stubbed in M0, behaves like "names")
# "off"    - no manifest check
enforce = "names"

[engine]
# engineHash check against the first player's hash (adopt-first, like content):
# "warn" logs mismatches, "refuse" disconnects with BAD_ENGINE, "off" skips.
enforce = "warn"

[rules]
# Where the respawn plugin sends the dead (M2). Defaults = the Example Suite demo's
# Village spawn point (the ?start=Village drop, verified by scenario s22); operators
# hosting other content override these in <dataDir>/config.toml.
respawnCellKey = "26,25"
respawnX = 216831.0
respawnY = 204909.0
respawnZ = 513.0
# Death penalty applied by the death-penalty plugin: "none" (M2 default; hook is a
# documented no-op seed for operators/plugins to extend).
deathPenalty = "none"
# M5: player-vs-player. false -> the pvp plugin drops CombatHit/CombatSpellHit aimed at
# players (actor targets are unaffected). Swap the plugin for faction/team rules.
pvp = false
# Difficulty is surfaced in SessionWelcome.flags and applied CLIENT-side, in the victim's
# own combat pipeline (the server never computes damage). Morrowind scale: -100..100.
difficulty = 0

[sharing]
# M6 per-family sharing policy, enforced by the `sharing` plugin (swap it to implement
# party/faction-scoped rules). true = relay to everyone and keep one shared copy;
# false = "individual" mode, stored per-player and never relayed.
journal = true
questVars = true      # MWScript globals (the time globals are owned by M7, never here)
factions = true
crime = true
map = true            # M7 WorldMapExplored; the toggle exists now so operators see it
# Quest ids whose journal index may legitimately go DOWN (some MW quests regress).
# Everything else is arbitrated monotonic-max: a lagging client can never rewind a quest.
regressAllowlist = []

[limits]
msgsPerSec = 60                   # per-session message token bucket (burst = rate)
moveMsgsPerSec = 40               # separate budget for the player's OWN PlayerMove frames; bypasses msgsPerSec
# Cell actor authority: the holder simulates every NPC in its cell and streams ActorMoveBatch
# for everyone else, ON TOP of its own pose. Sharing one budget meant the busiest, most
# useful client tripped the limit first — so the actor stream gets its own. Nominal is 15 Hz;
# 60 leaves room for a hitching client catching up and for a re-broadcast after a handoff.
actorMoveMsgsPerSec = 60
bytesPerSec = 65536               # per-session byte token bucket (burst = rate)
# Outbound backpressure. `ws` queues bytes a client has not read in SERVER memory with no
# ceiling, so in a crowded cell one stalled reader grows RSS for everyone. Past the soft
# limit only LOSSY frames (movement / actor batches) are dropped — a stale pose is corrected
# by the next one; chat, journal and object ops are never shed. Past the hard limit the
# session is dropped: a client that cannot drain 1 MB is not playing. Two keys rather than a
# multiplier so an operator can widen the shed window without also widening the kill window.
maxBufferedBytes = 262144         # 256 KB ~= 4 s of the byte budget
maxBufferedBytesHard = 1048576    # 1 MB
maxConnsPerIp = 3
maxMsgBytes = 262144              # ws maxPayload; larger frames drop the socket
# SessionHello deadline. Generous on purpose: the browser client opens its socket from Lua,
# but Hello can only be sent on the next Lua tick — and while the engine streams game data
# and loads the world, ticks can stall for tens of seconds. At 10s a retail client was
# reliably refused with BAD_PROTO before it ever spoke. This still reaps dead sockets; it
# just doesn't punish players with big load orders or slow connections.
helloTimeoutMs = 45000
loginPerMinPerIp = 5              # auth attempts (Register+Login) per IP per minute
maxHitDamage = 1000               # M5 sanity bound on relayed damage/effect magnitudes (not balance)

# Interest management + level of detail. Cell-granular visibility alone makes one busy cell
# an N x N pose mesh, and at 64 co-located players the binding constraint is CLIENT cost —
# every tab renders and interpolates 63 avatars plus the NPCs — not bandwidth. These knobs
# cut what each client has to draw and process. Distances are Morrowind world units
# (1 exterior cell = 8192). All of it applies to EXTERIOR cells only: interiors stay
# cell-granular, because there "too far to matter" is an occlusion question, not a distance
# one, and a radius tuned for open terrain would pop peers standing one wall away.
interestRadius = 12288            # 1.5 cells: beyond this a peer leaves your view. 0 = no culling
# The band a player must re-cover to flip state. Enter at interestRadius, leave only past
# interestRadius + this. Equal thresholds would make anyone walking the line spawn and
# despawn on alternate ticks in every other client.
interestHysteresis = 2048
# Nearest-K floor: the K closest peers stay in view whatever the radius says, so culling can
# never make someone feel alone in a crowd.
interestMinPeers = 12
# Send rate by distance. The client interpolates with a 100 ms render delay, so a lower rate
# for distant players costs almost nothing visually. Also tiers the holder's ActorMoveBatch
# stream — a distant player does not need 15 Hz NPC updates either. Rates are rounded to a
# whole number of 66 ms ticks (15/5/1 Hz -> every 1st/3rd/15th).
lodNearRadius = 4096              # <= this: near tier
lodMidRadius = 8192               # <= this: mid tier; beyond it, far tier (until interestRadius)
lodNearHz = 15
lodMidHz = 5
lodFarHz = 1
# How hard clients degrade DISTANT AVATARS (players), reusing the radii above so a puppet
# updated at 1 Hz is never also asked to walk smoothly:
#   "tiered" - near avatars are fully simulated; mid/far stop driving the character
#              controller and are repositioned instead. Everyone stays visible.
#   "full"   - every avatar fully simulated regardless of distance (pre-G2 behaviour).
#              Costs ~1.3 ms of client frame time per co-located avatar; kept as the
#              control for capacity measurements.
renderLod = "tiered"
# Hard ceiling on how many avatars a client fully simulates, whatever the radius says.
# 0 disables the cap. The radius alone does not bound cost in the case that matters: in a
# tight crowd everyone is inside the near radius, so everyone stays fully simulated and
# frame time scales with the crowd again. With the cap, worst-case client cost is
# lodNearMaxAvatars * ~1.2ms + (everyone else) * ~0.06ms, independent of clustering.
# 12 keeps a co-located 64 inside a 30fps budget; raise it for small co-op sessions where
# fidelity matters more than headroom.
lodNearMaxAvatars = 12

[time]
# M7: the server owns the clock. Morrowind scale = 30 (30 game seconds per real second);
# 0 freezes time (it then only moves on a WorldTimeRequest, i.e. resting/waiting).
# The calendar itself (hour/day/month/year) persists in world/global.json across restarts;
# this value is operator truth and is re-applied on every boot.
scale = 30

[gui]
# M7: how long a server-pushed GuiMessageBox/GuiInputDialog/GuiListBox waits for a reply
# before the plugin's promise settles as unanswered. A disconnect settles it immediately.
timeoutSec = 60

[cellReset]
# M7: cells wiped on a schedule by the `cell-reset` plugin (loot/containers/doors/objects
# return to their content-file state and clients are told to reload). Empty = no resets.
cells = []
intervalSec = 259200              # 3 days; only applies to the cells listed above

[admin]
# M8: accounts promoted to rank 3 (owner) on every boot, so the first operator never has
# to hand-edit accounts/<name>.json. Ranks: 0 player, 1 moderator (kick/tp/tpto),
# 2 admin (ban/unban/ipban/give/motd), 3 owner (setrank/console).
owners = []
# /console ships arbitrary Lua to a player's OWN machine. Owner-only even when true, and
# every use is logged with actor, target and the full payload. Set false to remove the
# capability from the server entirely.
allowConsole = true

[moderation]
# A4: durable chat log + /report inbox under <dataDir>/logs and <dataDir>/reports.
# Public play needs evidence an admin can read after the fact; stdout is not that (it is
# level-filtered and rotated by the supervisor). See PRIVACY.md — this is personal data.
chatLog = true
# Days of chat logs and reports to keep. Matches the documented backup retention (README).
# 0 = prune everything older than today, i.e. effectively keep only the current day.
retentionDays = 14
# How many recent chat lines are attached to a /report as context. This is what an admin
# actually needs: a reason with no surrounding conversation is not actionable.
contextLines = 20

[authority]
# M4 cell actor authority: ONE client per cell simulates every NPC there and streams
# ActorMoveBatch to the rest, on top of playing the game itself. It is the heaviest seat in
# the room, so it is elected on measured fitness rather than on who arrived first.
# Fitness is the SERVER's own round-trip measurement (WebSocket ping/pong with an echoed
# stamp) plus the client's outbound shed rate. A client-reported latency is never used: it
# would let a modified client seize or dodge the role at will.
rttProbeSec = 5        # ping cadence; ~6 B/s/player. The 50 s keepalive deadline is unchanged.
reviewSec = 10         # how often a cell re-checks its holder (cheap: a scan of held cells)
unknownRttMs = 200     # score for a player with no sample yet — never a free promotion
shedPenaltyMs = 500    # a 100%-shed client is scored 500 ms worse than a clean one
# A challenger must beat the incumbent by BOTH margins. Absolute margin ignores jitter;
# the ratio stops "350 vs 400 ms" (both unplayable) from counting as an improvement.
improveMs = 40
improveRatio = 0.75    # must be <= 1
# Degradation gate. The holder must sit above degradeScoreMs continuously for sustainSec
# before it is even a candidate for replacement — a single bad sample proves nothing. After
# any re-election the cell is frozen for cooldownSec: a handoff costs a snapshot plus a
# re-sync for everyone in the cell, so a flapping holder is worse than a mediocre one.
degradeScoreMs = 250
sustainSec = 30
cooldownSec = 60
# A player who just walked in may be about to walk out; below this age they are not
# electable while any settled occupant exists.
settleSec = 20

[metrics]
# Prometheus text-format scrape endpoint at GET /metrics. OFF by default: the numbers are
# operational (player counts, auth failures, latency) and the endpoint is not something a
# public listener should expose by accident.
enabled = false
# Required bearer token: scrapers must send `Authorization: Bearer <token>`. An empty
# token disables the endpoint even when enabled = true — there is no unauthenticated mode.
# While disabled the route answers 404, exactly like any other unknown path, so a prober
# cannot tell that this server has metrics at all.
token = ""

[auth]
# Phase B: single sign-on ALONGSIDE the account+password path, never instead of it.
# Flow: Authorization Code + PKCE (S256), with the code->token exchange done HERE, on the
# server, holding the client secret (a Backend-For-Frontend). The provider's access/refresh
# /ID tokens never reach the browser and never enter the WebSocket protocol; the browser
# only ever receives a one-time, 60-second login ticket. Implicit flow is not implemented
# and will not be (RFC 9700 s2.1.2 deprecates it).
# Accounts are keyed on (issuer, subject). NEVER on email: email is mutable and providers
# re-assign it, so keying on it would hand one player's character to another. No email
# scope is requested at all.
allowPasswordLogin = true
# Where the callback sends the browser back to — your game page. The result arrives in the
# URL FRAGMENT (#mpticket=..., #mperror=..., #mplink=...) so it is never logged, cached or
# sent in a Referer. Required as soon as any provider below is enabled. A `return`
# parameter from the caller is ignored: this server is not an open redirector.
returnUrl = ""

# Per provider: register `redirectUri` with the provider EXACTLY as written here.
#   discord   -> https://discord.com/developers/applications  (OAuth2 -> Redirects)
#   google    -> https://console.cloud.google.com/apis/credentials  (OAuth client, type "Web")
#   microsoft -> https://entra.microsoft.com  (App registrations -> Authentication -> Web)
#   custom    -> any OIDC issuer (Keycloak, Authentik, Auth0...); `issuer` is REQUIRED and
#                must serve /.well-known/openid-configuration.
# `issuer` overrides the well-known issuer (leave "" for the three named providers).
# `scope` overrides the default ("identify" for Discord, "openid profile" otherwise).

[auth.discord]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.google]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.microsoft]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

[auth.custom]
enabled = false
clientId = ""
clientSecret = ""
redirectUri = ""
issuer = ""
scope = ""

# Phase H — on-demand headless simulation peer.
# A real (rendering-disabled) OpenMW that connects like a client and holds cell authority,
# so NPCs are simulated on the operator's machine instead of in a player's browser. This is
# what stops a modified client authoring NPC state for everyone else.
# OFF by default: it needs a native openmw binary AND game data on the server, which a
# self-hoster may not have. With it off, the existing client-authority election is unchanged.
[simPeer]
# auto  = run a peer IF game data validates AND a binary is found. Silence is the right
#         outcome for a self-hoster with neither; multiplayer is unaffected either way.
# on    = the operator INTENDS server-side simulation: refuse to boot if it cannot run, so a
#         misconfiguration is loud instead of silently falling back to client-simulated NPCs.
# off   = never.
mode = "auto"
binary = ""                       # absolute path to the headless-capable openmw
configDir = ""                    # its own --config dir (isolated openmw.cfg + settings.cfg)
userDataDir = ""                  # its own --user-data dir
startCell = "Seyda Neen"
maxPeers = 4                      # hard ceiling; measured cost is ~360 MB + ~9% of a core each
idleReapMs = 120000               # reap a peer whose world has had no humans this long
startTimeoutMs = 120000           # retail data load is slow; generous, and failure is non-fatal
restartBackoffMs = 15000          # after a crash, wait before respawning (no hot crash loop)

# F3 — the world directory this world's players can browse from the in-game Social menu.
# Empty means no gateway: the Worlds tab says so and everything else works normally, which
# is the right experience for a single self-hosted world.
[gateway]
url = ""
