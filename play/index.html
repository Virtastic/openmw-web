<style>
 html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
 /* Windowless: the canvas fills the entire browser viewport; its drawing buffer is driven
    from window.innerWidth/Height in JS so the render resolution always matches the window. */
 #canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;border:0;outline:none;background:#000}
 /* Debug log kept in the DOM (readable via devtools console / eval) but hidden;
    press the ` (backtick) key to toggle it. */
 #log{position:fixed;left:0;bottom:0;width:100%;max-height:40%;box-sizing:border-box;z-index:10;
      display:none;overflow:auto;margin:0;padding:6px 10px;white-space:pre-wrap;
      background:rgba(10,10,15,.85);color:#a6e3a1;font:11px/1.35 ui-monospace,Menlo,monospace}
 #log.show{display:block}
 .err{color:#f38ba8}
 /* Always-visible compact status: FPS + latest phase. Toggle full log with backtick (`). */
 /* Debug HUD (FPS / status / log toggle) is hidden by default — a clean screen for players.
    Opt in with ?hud=1 (adds .show); it's also auto-revealed on the first fault so errors stay
    reachable. See the boot script. */
 #hud{display:none;position:fixed;top:0;left:0;z-index:11;padding:3px 9px;cursor:pointer;max-width:100vw;
      overflow:hidden;white-space:pre;background:rgba(10,10,15,.72);color:#89b4fa;
      font:11px/1.35 ui-monospace,Menlo,monospace;text-shadow:0 1px 2px #000;user-select:none}
 #hud.show{display:block}
 #hud:hover{background:rgba(20,20,30,.9)}
 /* Save backup/restore controls — top-right, appear once the game is running. */
 #savetools{position:fixed;top:0;right:0;z-index:11;display:none;gap:6px;padding:3px 8px;
      background:rgba(10,10,15,.72);font:11px/1.35 ui-monospace,Menlo,monospace}
 #savetools.show{display:flex}
 #savetools button{cursor:pointer;background:rgba(20,20,30,.6);color:#cba6f7;border:1px solid #45475a;
      border-radius:4px;padding:2px 8px;font:inherit}
 #savetools button:hover{background:rgba(40,40,55,.95);color:#f5e0dc}
 /* --- Themed loading overlay (matches launcher.html: ash + Dwemer bronze + Red Mountain
    ember). Covers the canvas during download/boot, fades out on the engine's first frame. --- */
 #loading{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
   padding:24px;text-align:center;background:#0c0a09;color:#ece0c6;
   font:16px/1.6 "Optima","Gill Sans","Gill Sans MT",-apple-system,"Segoe UI",Roboto,sans-serif;
   transition:opacity .6s ease}
 #loading.hide{opacity:0;pointer-events:none}
 #loading::before{content:'';position:absolute;inset:0;pointer-events:none;
   background:radial-gradient(150% 72% at 50% 132%, rgba(198,90,46,.30), rgba(198,90,46,.05) 34%, transparent 60%),
     radial-gradient(90% 60% at 50% 134%, rgba(233,180,90,.16), transparent 56%);
   animation:ldEmber 9s ease-in-out infinite}
 @keyframes ldEmber{0%,100%{opacity:.82}50%{opacity:1}}
 #loading .ld-inner{position:relative;width:100%;max-width:440px}
 #loading .ld-glyph{width:56px;height:56px;margin:0 auto 24px;color:#c69a52;animation:ldSpin 7s linear infinite}
 #loading .ld-glyph svg{width:100%;height:100%;display:block}
 @keyframes ldSpin{to{transform:rotate(360deg)}}
 #loading .ld-title{margin:0 0 10px;font-family:"Hoefler Text","Baskerville","Palatino Linotype",Palatino,Georgia,serif;
   font-weight:600;font-size:clamp(28px,5vw,40px);letter-spacing:.01em;color:#ece0c6;
   text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 34px rgba(211,168,78,.10)}
 #loading .ld-status{margin:0 0 22px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
   font-weight:600;color:#c69a52}
 #loading .ld-bar{position:relative;height:4px;border-radius:3px;overflow:hidden;background:rgba(138,104,56,.28)}
 #loading .ld-fill{height:100%;width:0;border-radius:3px;
   background:linear-gradient(90deg,#8a6838,#d3a84e,#eecb78);transition:width .3s ease}
 #loading.indet .ld-fill{width:34%;animation:ldSlide 1.25s ease-in-out infinite}
 @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
 #loading .ld-detail{margin-top:13px;min-height:16px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#7c705c}
 #loading .ld-credit{margin-top:26px;font-size:11px;letter-spacing:.08em;color:#6a5f4d}
 #loading .ld-credit a{color:#8a6838;text-decoration:none;border-bottom:1px solid rgba(138,104,56,.45)}
 @media (prefers-reduced-motion:reduce){
   #loading::before,#loading .ld-glyph{animation:none}
   #loading.indet .ld-fill{animation:none;width:100%}
 }

<body>

  <input id="restore-file" type="file" accept=".tar" style="display:none">
</div>
<div id="log">booting…</div>
<div id="loading" class="indet">
  <div class="ld-inner">
    <div class="ld-glyph" aria-hidden="true">

        <circle cx="24" cy="24" r="17"/>
        <circle cx="24" cy="24" r="2.2" fill="currentColor" stroke="none"/>

  </div>
</div>
<script>
 // ?wasmdbg: introspect what the glue passes to WebAssembly.instantiate (debug the env-import error)
 if (/[?&]wasmdbg\b/.test(location.search)) (function(){
   var oi = WebAssembly.instantiate.bind(WebAssembly);
   WebAssembly.instantiate = function(bufOrMod, imports){
     try {
       console.log('[wasmdbg] instantiate called; imports type:', typeof imports,
         '| keys:', imports ? Object.keys(imports).join(',') : '(none)',
         '| env type:', imports && typeof imports.env,
         '| env keys:', imports && imports.env ? Object.keys(imports.env).length : -1,
         '| memory:', imports && imports.env && String(imports.env.memory));
     } catch(e){ console.log('[wasmdbg] introspect err', e); }
     return oi(bufOrMod, imports);
   };
   var os = WebAssembly.instantiateStreaming && WebAssembly.instantiateStreaming.bind(WebAssembly);
   if (os) WebAssembly.instantiateStreaming = function(src, imports){
     try { console.log('[wasmdbg] instantiateStreaming; env type:', imports && typeof imports.env, '| env keys:', imports && imports.env ? Object.keys(imports.env).length : -1); } catch(e){}
     return os(src, imports);
   };
 })();
 // Wrap getContext (installed BEFORE openmw.js loads) to fix the WebGL2 context attributes:
 //  - alpha:false (CORRECTNESS): the default transparent canvas composites the PAGE BACKGROUND
 //    through any fragment with dst-alpha<1 (halos on particles/weather/GUI edges) and treats
 //    canvas pixels as premultiplied while OpenMW blends straight alpha (double-darkening).
 //    Desktop renders to an opaque framebuffer; so must we.
 //  - powerPreference:'high-performance' (A2): pick the discrete GPU on dual-GPU machines.
 (function(){
   var orig = HTMLCanvasElement.prototype.getContext;
   HTMLCanvasElement.prototype.getContext = function(type, attrs){
     if (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl'){
       attrs = attrs || {};
       attrs.alpha = false;                 // opaque canvas — desktop framebuffer semantics
       attrs.premultipliedAlpha = false;    // moot with alpha:false; explicit for clarity
       if (!window.__NO_GPU_HINT && !/[?&]noopt\b/.test(location.search)
           && attrs.powerPreference == null) attrs.powerPreference = 'high-performance';
       // desynchronized disabled — suspected first-frame hang in headless preview.
     }
     var ctx = orig.call(this, type, attrs);
     // Enable EXT_texture_filter_anisotropic on the context: WebGL2 reports it in the extension
     // string (so OSG thinks it's usable) but the GL_TEXTURE_MAX_ANISOTROPY_EXT pname is only
     // ACCEPTED after getExtension() is called on the context — otherwise glTexParameterf raises
     // GL_INVALID_ENUM. Calling it here lets the OSG anisotropy path work (see Texture.cpp).
     if (ctx && (type === 'webgl2' || type === 'webgl' || type === 'experimental-webgl')) {
       try { ctx.getExtension('EXT_texture_filter_anisotropic'); } catch (e) {}
       // EXT_color_buffer_float: makes RGBA16F/RGBA32F color-renderable so post-processing float
       // render targets (e.g. bloom) are FBO-complete instead of rendering black.
       try { ctx.getExtension('EXT_color_buffer_float'); } catch (e) {}
       try { ctx.getExtension('EXT_color_buffer_half_float'); } catch (e) {}
       try { ctx.getExtension('OES_texture_float_linear'); } catch (e) {}
     }
     return ctx;
   };
 })();
 const logEl = document.getElementById('log');
 let started = false;
 // HRTF binaural spatialization: emscripten's OpenAL positions sources with PannerNodes
 // left at the default 'equalpower' model. Flip every panner the engine creates to the
 // Web Audio HRTF model — proper binaural 3D audio on headphones, no engine change.
 // (?nohrtf opts out for A/B comparison or low-end CPUs.)
 (function(){
   if (/[?&]nohrtf\b/.test(location.search)) return;
   ['AudioContext','webkitAudioContext'].forEach(function(k){
     var C = window[k];
     if (!C || !C.prototype || !C.prototype.createPanner) return;
     var orig = C.prototype.createPanner;
     C.prototype.createPanner = function(){
       var p = orig.call(this);
       try { p.panningModel = 'HRTF'; } catch(e){}
       return p;
     };
   });
 })();
 // Web Audio contexts start "suspended" until a user gesture. OpenMW opens the OpenAL
 // device fine, but nothing is audible until we resume. Track every AudioContext the
 // engine creates and resume them all on the first click/keypress.
 (function(){
   const audioCtxs = [];
   ['AudioContext','webkitAudioContext'].forEach(function(k){
     const Orig = window[k];
     if (!Orig) return;
     window[k] = function(){ const c = new Orig(...arguments); audioCtxs.push(c); return c; };
     window[k].prototype = Orig.prototype;
   });
   function resumeAll(){ audioCtxs.forEach(function(c){ if(c.state==='suspended') c.resume(); }); }
   ['pointerdown','keydown','touchstart','click'].forEach(function(ev){
     window.addEventListener(ev, resumeAll, {capture:true});
   });
 })();
 const hudEl = document.getElementById('hud');
 // Debug HUD is opt-in: ?hud=1 (or ?debug) shows the FPS/status bar + the log toggle (backtick) +
 // auto-reveal on fault. When it's OFF (the default player experience) NONE of that shows — no
 // initial bar, no fault reveal, and backtick/Esc do NOT open our overlay (backtick passes through
 // to the engine so the in-game Morrowind console opens as normal).
 const __hudEnabled = /[?&](hud=1|debug)\b/.test(location.search);
 if (__hudEnabled) hudEl.classList.add('show');
 let lastMsg = 'booting…';
 function append(t, cls){ if(!started){logEl.textContent='';started=true;}
   const s=document.createElement('span'); if(cls)s.className=cls; s.textContent=t+"\n"; logEl.appendChild(s);
   logEl.scrollTop=logEl.scrollHeight;
   lastMsg = String(t).slice(0, 90);
   // keep the DOM log from growing unbounded
   while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
   try { if (window.__omwLoading) window.__omwLoading.fromLog(String(t)); } catch(e){} }
 // Themed loading overlay controller. Driven by setStatus (engine download %), append()
 // log lines (game-data download / local mount phases), and hidden on the first engine frame.
 window.__omwLoading = (function(){
   var el, titleEl, st, fill, det, done=false, inited=false;
   function E(){
     if (inited) return el; inited=true;
     el=document.getElementById('loading'); titleEl=document.getElementById('ld-title');
     st=document.getElementById('ld-status'); fill=document.getElementById('ld-fill');
     det=document.getElementById('ld-detail');
     // Same themed screen for every path — title stays "Elder Scrolls III: Morrowind".
     return el;
   }
   function set(pct, label, detail){
     if (done || !E()) return;
     if (label) st.textContent = label;
     if (detail != null) det.textContent = detail;
     if (typeof pct === 'number'){ el.classList.remove('indet'); fill.style.width = Math.max(0,Math.min(100,pct)) + '%'; }
     else el.classList.add('indet');
   }
   function fromLog(t){
     var m;
     // Generic, path-agnostic phase labels — same screen whether booting the sample or your files.
     if ((m = /^\[dl\]\s+(\S+)\s+(\d+)%/.exec(t)))      set(+m[2], 'Downloading', m[1] + ' ' + m[2] + '%');
     else if (/^\[dl\]/.test(t))                        set(null, 'Downloading', t.replace(/^\[dl\]\s*/, ''));
     else if (/^\[local\] scanning/.test(t))            set(null, 'Loading');
     else if ((m = /^\[local\] mounted (\d+) files/.exec(t))) set(null, 'Loading', m[1] + ' files');
     else if (/^\[(local|mw)\] READY/.test(t))          set(null, 'Entering the world');
     else if (/SKIPPED \(nomw\)/.test(t))               set(null, 'Loading');
     else if (/^\[mw\] loading Morrowind/.test(t))      set(null, 'Downloading');
   }
   function finish(){
     if (done || !E()) return; done=true;
     el.classList.remove('indet'); fill.style.width='100%'; el.classList.add('hide');
     setTimeout(function(){ if (el) el.style.display='none'; }, 700);
   }
   return { set:set, fromLog:fromLog, done:finish };
 })();
 // Full-screen fatal overlay: aborts, GPU context loss, unsupported browsers. The hidden dev
 // log is useless to end users — anything fatal must be VISIBLE with a way forward.
 function fatalOverlay(title, detail, showReload){
   try {
     var o = document.createElement('div');
     o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(8,8,12,.96);color:#cdd6f4;'
       + 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;'
       + 'font:15px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:24px';
     var h = document.createElement('div'); h.style.cssText='font-size:20px;color:#f38ba8'; h.textContent = title;
     var d = document.createElement('div'); d.style.maxWidth='640px'; d.textContent = detail || '';
     o.appendChild(h); o.appendChild(d);
     if (showReload !== false){
       var b = document.createElement('button');
       b.textContent = 'Reload';
       b.style.cssText = 'font:16px ui-monospace,Menlo,monospace;padding:8px 26px;cursor:pointer;'
         + 'background:#313244;color:#cdd6f4;border:1px solid #585b70;border-radius:6px';
       b.addEventListener('click', function(){ location.reload(); });
       o.appendChild(b);
     }
     document.body.appendChild(o);
   } catch(e){}
 }
 // Hard requirement check: this build uses pthreads (SharedArrayBuffer), which needs
 // cross-origin isolation and a capable browser. Fail with a CLEAR message, not a cryptic
 // instantiation error (Safari/iOS and non-isolated hosts land here).
 if (!self.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined'){
   fatalOverlay('Browser not supported',
     'This build needs SharedArrayBuffer + cross-origin isolation (COOP/COEP headers). '
     + 'Use a desktop Chrome/Edge/Firefox, and serve via play/server.py or an HTTPS host '
     + 'sending COOP: same-origin and COEP: require-corp.', false);
 }
 // WebGL context loss: OSG/OpenMW has no GPU-resource restore path, so the correct handling
 // tier is: sync saves, tell the user, reload cleanly (state comes back from IndexedDB).
 (function(){
   var canvas = document.getElementById('canvas');
   canvas.addEventListener('webglcontextlost', function(e){
     e.preventDefault();
     try { if (window.__omwSync) window.__omwSync(); } catch(ex){}
     append('GPU context lost', 'err');
     fatalOverlay('Graphics context lost',
       'The browser reset the GPU context (driver reset or resource pressure). '
       + 'Your saves are safe. Reloading…');
     setTimeout(function(){ location.reload(); }, 2500);
   });
   canvas.addEventListener('webglcontextrestored', function(){ append('GPU context restored'); });
 })();
 // Surface unhandled promise rejections + JS errors (previously silent) and auto-open the log
 // the FIRST time a genuine JS fault occurs — NOT on routine engine warnings (OpenMW routes
 // Debug::Warning through printErr, which would otherwise pop the log open constantly).
 var __firstFaultShown = false;
 // Only auto-reveal on a fault when the debug HUD is enabled — otherwise players never see our
 // overlay (an Esc-triggered pointer-lock rejection used to pop the FPS bar up here).
 function showLogOnce(){ if(__hudEnabled && !__firstFaultShown){ __firstFaultShown = true; hudEl.classList.add('show'); logEl.classList.add('show'); } }
 // NOTE: the single 'unhandledrejection' handler lives at the bottom of this script — it filters the
 // benign pointer-lock rejection BEFORE logging. (There used to be a second handler here that
 // double-logged every rejection and popped the log open on the pointer-lock case it was meant to hide.)
 // Log is hidden by default. When the debug HUD is enabled (?hud=1/?debug) it can be toggled by
 // CLICKING the status bar or pressing ` (backtick). When the HUD is OFF, backtick is NOT captured
 // here — it falls through to the engine so the in-game Morrowind console opens normally.
 function toggleLog(){ logEl.classList.toggle('show'); }
 hudEl.addEventListener('click', toggleLog);
 if (__hudEnabled)
   window.addEventListener('keydown', function(e){ if (e.key === '`') toggleLog(); });
 // Live status HUD + periodic console logging so you can SEE what's happening / the FPS.
 (function(){
   let lastFps = -1, tick = 0;
   setInterval(function(){
     const fps = (window.__fps|0), ms = (window.__frameMs||0);
     // Fade the loading overlay only when the engine's main loop is ACTUALLY rendering (the start
     // screen is up), not merely when the pump function exists — _omw_pump_frame is exported the
     // instant the wasm loads, long before game data downloads/loads and the menu appears, so
     // gating on it uncovered the rest of the boot. __omwRunning is set by the engine's frame loop
     // on its first real frame, so it covers the whole boot (wasm + game data + init) end to end.
     const rendering = !!(window.Module && window.Module.__omwRunning !== undefined);
     const running = rendering || !!(window.Module && window.Module._omw_pump_frame);
     if (rendering && window.__omwLoading) window.__omwLoading.done();
     // Save Backup/Restore toolbar is opt-in (?savetools=1) — hidden by default so it never sits in
     // the chrome. The tar backup/restore functionality stays wired up; only the buttons are gated.
     if (rendering && /[?&]savetools=1\b/.test(location.search)) { var st=document.getElementById('savetools'); if (st) st.classList.add('show'); }
     // The visible HUD text + console heartbeat only matter when the debug HUD is on. For the default
     // player (HUD hidden) skip both — no point writing textContent to a display:none node twice a
     // second or growing the console forever. (The loading-overlay fade + savetools above still run.)
     if (!__hudEnabled) return;
     const open = logEl.classList.contains('show');
     hudEl.textContent = '☰ ' + (running ? ('FPS '+fps+'  ('+ms+'ms/frame)') : 'loading…') + '   ' + lastMsg + (open ? '   [click to hide log]' : '   [click for log]');
     // Console: log on FPS change or every ~4s so devtools shows a live heartbeat.
     tick++;
     if (running && (fps !== lastFps || tick % 8 === 0)){
       console.log('[status] fps='+fps+' frameMs='+ms+' | '+lastMsg);
       lastFps = fps;
     }
   }, 500);
 })();

 // --- Save backup / restore. Everything persistent (saves, settings, keybindings, screenshots)
 // lives under /userdata on IDBFS. Backup tars that whole tree so a player can move machines or
 // recover from browser-data loss; Restore unpacks a backup and re-syncs it to IndexedDB. Uses a
 // tiny self-contained USTAR reader/writer (no deps). ---
 (function(){
   var ROOT='/userdata';
   function octal(n,len){ var s=n.toString(8); while(s.length<len-1) s='0'+s; return s+'\0'; }
   // Build a 512-byte tar header. typeflag 48='0' (regular file), 76='L' (GNU @LongLink). Names >100
   // bytes are carried by a preceding '@LongLink' record (see makeTar) so NOTHING is truncated — long
   // OpenMW save filenames round-trip intact. (FS paths are ASCII, so char length == byte length.)
   function tarHeader(name, size, typeflag){
     var hdr=new Uint8Array(512), enc=new TextEncoder();
     function put(str,off,len){ var b=enc.encode(str); for(var i=0;i<b.length&&i<len;i++) hdr[off+i]=b[i]; }
     put(name,0,100);
     put('0000644\0',100,8);                           // mode
     put('0000000\0',108,8); put('0000000\0',116,8);   // uid/gid
     put(octal(size,12),124,12);                       // size
     put(octal(0,12),136,12);                          // mtime (0; deterministic)
     for(var i=148;i<156;i++) hdr[i]=32;               // checksum field = spaces while summing
     hdr[156]=typeflag;
     put('ustar\0',257,6); put('00',263,2);
     var sum=0; for(var j=0;j<512;j++) sum+=hdr[j];
     var cs=sum.toString(8); while(cs.length<6) cs='0'+cs; cs=cs.slice(-6);
     put(cs,148,6); hdr[154]=0; hdr[155]=32;           // checksum: 6 octal digits + NUL + space
     return hdr;
   }
   // Walk FS collecting {path,data} for every regular file under dir.
   function collect(dir, out){
     var ents; try { ents=FS.readdir(dir); } catch(e){ return; }
     ents.forEach(function(name){
       if (name==='.'||name==='..') return;
       var p=dir+'/'+name, st;
       try { st=FS.stat(p); } catch(e){ return; }
       if (FS.isDir(st.mode)) collect(p, out);
       else if (FS.isFile(st.mode)) { try { out.push({path:p, data:FS.readFile(p)}); } catch(e){} }
     });
   }
   function makeTar(files){
     var blocks=[], enc=new TextEncoder();
     function pad(n){ var p=(512-(n%512))%512; if(p) blocks.push(new Uint8Array(p)); }
     files.forEach(function(f){
       var name=f.path.replace(/^\//,'');             // tar paths are relative
       if(name.length>100){                           // GNU longname: carry the full path in an
         var lb=enc.encode(name+'\0');                // '@LongLink' record so nothing is truncated
         blocks.push(tarHeader('././@LongLink', lb.length, 76 /* 'L' */), lb); pad(lb.length);
       }
       blocks.push(tarHeader(name.slice(0,100), f.data.length, 48 /* '0' */), f.data); pad(f.data.length);
     });
     blocks.push(new Uint8Array(1024));               // two zero blocks = end
     var total=blocks.reduce(function(a,b){return a+b.length;},0), buf=new Uint8Array(total), off=0;
     blocks.forEach(function(b){ buf.set(b,off); off+=b.length; });
     return buf;
   }
   function readTar(buf){
     var dec=new TextDecoder(), out=[], off=0, longName=null;
     while(off+512<=buf.length){
       var name=dec.decode(buf.subarray(off,off+100)).replace(/\0.*$/,'');
       var typeflag=buf[off+156];
       var size=parseInt(dec.decode(buf.subarray(off+124,off+136)).replace(/[\0 ]/g,''),8)||0;
       if(!name && typeflag!==76){ break; }            // zero block = end of archive
       off+=512;

 // --- Windowless full-viewport rendering: keep the canvas DRAWING BUFFER matched to the
 // browser window so OpenMW renders at exactly the window resolution and fills it. OpenMW's
 // SDL2 window is SDL_WINDOW_RESIZABLE and fires SDL_WINDOWEVENT_SIZE_CHANGED -> windowResized()
 // (resizes viewport + FBOs + GUI) whenever the canvas size changes, so we just drive the size. ---
 (function(){
   var canvas = document.getElementById('canvas');
   // Compute a capped RENDER resolution from the window + a pixel budget, ONCE. OpenMW creates
   // its SDL window at [Video] resolution x/y (written from these in preRun), so the canvas
   // drawing buffer matches what SDL expects — NO JS<->SDL resize war (that war recreated the
   // FBOs repeatedly and froze the engine). CSS (#canvas is 100vw/100vh) scales the capped
   // render up to fill the window. Perf lever: window.__maxPixels (set before load).
   // Render at DEVICE pixels, not CSS pixels: on a retina/HiDPI display (devicePixelRatio 2)
   // a 1710-CSS-px window is 3420 physical px, so rendering at 1710 and letting CSS upscale 2x
   // looked soft ("not using the resolution"). Multiply by devicePixelRatio so we render at the
   // display's true pixels, then cap by the pixel budget below.
   var dpr = window.devicePixelRatio || 1;
   var cssW = window.innerWidth || 1280, cssH = window.innerHeight || 720;
   var w = cssW * dpr, h = cssH * dpr;
   // 4MP cap: on retina this lands ~2700x1470 (crisp, perf-safe) instead of the physical 6MP+.
   // The engine has headroom (wasm-EH + SIMD ~4.4ms/frame at 1.2MP). Override via __maxPixels.
   var budget = window.__maxPixels || 4000000;
   var scale = Math.min(1, Math.sqrt(budget / (w * h)));
   // SUPERSAMPLING anti-aliasing (SSAA): render the canvas at ss× the display size and let the
   // browser downscale it (#canvas is 100vw/100vh) — the downscale is a high-quality box filter, so
   // edges (and shader aliasing) are smoothed. This deliberately AVOIDS hardware MSAA, whose
   // multisample-resolve blit renders black on the web's GLES path; SSAA uses the ordinary
   // single-sample render path that already works. Opt-in via ?ss=2 or window.__superSample; capped
   // at 2x (4x fragment cost). Off (ss=1) by default so the default perf is unchanged.
   // ?ss=N sets the supersample factor AND remembers it (localStorage), so you set it once and it
   // sticks across reloads without keeping the URL. ?ss=1 turns it back off. Precedence:
   // window.__superSample > ?ss= (persisted) > last-saved value > 1.
   var _ssm = /[?&]ss=(\d+(?:\.\d+)?)/.exec(location.search);
   var ss = 1;
   try {
     if (window.__superSample) ss = window.__superSample;
     else if (_ssm) { ss = parseFloat(_ssm[1]); localStorage.setItem('omw_ss', String(ss)); }
     else { ss = parseFloat(localStorage.getItem('omw_ss')) || 1; }
   } catch (e) { ss = _ssm ? parseFloat(_ssm[1]) : 1; }
   ss = Math.max(1, Math.min(2, ss));
   window.__baseScale = scale;   // budget-capped scale BEFORE SSAA (basis for the live SSAA resize)
   scale *= ss;
   // MEMORY-SAFETY CEILING. SSAA multiplies the drawing buffer past the pixel budget, and the whole
   // post-processing target stack scales with it. On top of the fixed ~1GB shadow map and ~1.5GB
   // working set, a persisted 2x on a big retina display allocated a framebuffer that OOM'd the heap
   // and FROZE the tab on boot. Clamp the FINAL buffer to a hard pixel count so SSAA degrades (less
   // supersampling on big displays) instead of crashing. Small displays still get the full factor.
   var __hardMax = window.__maxRenderPixels || 5500000;
   if (w * h * scale * scale > __hardMax)
     scale = Math.sqrt(__hardMax / (w * h));
   window.__ssaaCurrent = scale / (window.__baseScale || scale);   // EFFECTIVE factor actually applied (<= ss after the clamp)
   window.__renderW = Math.max(320, Math.round(w * scale));
   window.__renderH = Math.max(240, Math.round(h * scale));
   // GUI scale = drawing-buffer px per CSS px. When the buffer is DPR-bigger than the CSS window,
   // MyGUI widgets (sized in buffer px) must scale UP by this ratio to stay the same on-screen size
   // — the engine multiplies gui.scalingFactor by this (windowmanagerimp.cpp). At DPR=1 it's ~1
   // (no change); on retina it's ~DPR*budgetScale so menus don't shrink. Inverse of the earlier
   // "oversized Options on retina" fix, now correct because the canvas really is device-pixel.
   window.__guiScale = window.__renderW / cssW;

   // resolution we write to settings.cfg, so nothing ever fights over it afterward.
   canvas.width = window.__renderW; canvas.height = window.__renderH;

   // (e.g. attack), and hijacking it to toggle fullscreen is hostile. Fullscreen is available
   // via the browser's own control / F11.
   canvas.addEventListener('pointerdown', function(){ canvas.focus(); });
   window.addEventListener('load', function(){ canvas.focus(); });

   // --- Live browser-window resize (debounced). The old naive per-interval resize caused an
   // FBO-recreation storm; a single application ~300ms after the LAST resize event is safe.
   // Applies through the engine (omw_set_resolution -> SDL_SetWindowSize -> windowResized),
   // which resizes viewport/FBOs/GUI exactly like a desktop window resize. ---
   var resizeTimer = null;
   window.addEventListener('resize', function(){
     if (resizeTimer) clearTimeout(resizeTimer);
     resizeTimer = setTimeout(function(){
       resizeTimer = null;
       if (!(window.Module && Module._omw_set_resolution)) return; // engine not up yet
       var dpr = window.devicePixelRatio || 1;

       var w = cssW * dpr, h = cssH * dpr;   // device pixels (match the boot IIFE)
       var budget = window.__maxPixels || 4000000;
       var scale = Math.min(1, Math.sqrt(budget / (w * h)));
       // New NATIVE (100%) render size for the resized window.
       var nw = Math.max(320, Math.round(w * scale)), nh = Math.max(240, Math.round(h * scale));
       // Preserve the player's chosen SCALE TIER across the resize: infer the integer divisor
       // (1=native, 2=50%, 3=33% …) from the current drawing buffer vs. the PREVIOUS native
       // (window.__renderW). The Options list only offers native/div tiers, so this is exact.
       var prevNativeW = window.__renderW || nw;
       var div = Math.max(1, Math.round(prevNativeW / Math.max(1, canvas.width)));
       // New buffer = new native / div (native kept exact; downscales evened for FBO/codec sanity).
       var rw = div === 1 ? nw : (Math.round(nw / div) & ~1);
       var rh = div === 1 ? nh : (Math.round(nh / div) & ~1);
       rw = Math.max(320, rw); rh = Math.max(240, rh);
       // Update the native baseline so the Options list (built from __renderW/H) reflects the
       // resized window on its next open, and the divisor stays inferable on the next resize.
       window.__renderW = nw; window.__renderH = nh;

       window.__guiScale = rw / cssW;
       if (rw === canvas.width && rh === canvas.height) return; // window unchanged -> nothing to do
       append('[resize] ' + rw + 'x' + rh + ' (1/' + div + ' of ' + nw + 'x' + nh + ')');
       try { Module._omw_set_resolution(rw, rh); } catch(e){ append('[resize err] '+e,'err'); }
     }, 300);
   });

   // --- Live SSAA (supersampling) bridge. Hardware MSAA can't run under post-processing on WebGL2
   // (can't resolve a multisampled depth buffer into the texture PP needs — postprocessor.cpp), so the
   // in-game Options "Antialiasing" dropdown drives SSAA instead: the engine calls this with a factor
   // (sqrt of the sample count, capped 2x) whenever the setting changes. We rescale the drawing buffer
   // by newFactor/oldFactor and push it through the same omw_set_resolution path the window-resize uses
   // — tier-agnostic (composes with the 50%/33% resolution tiers). Measured free at 60fps (CPU-bound,
   // GPU absorbs the 4x fragments). Persisted to localStorage so it sticks across reloads. ---
   window.__omwSetSSAA = function(factor){
     factor = Math.max(1, Math.min(2, +factor || 1));
     try { localStorage.setItem('omw_ss', String(factor)); } catch(e){}
     // Recompute the buffer from scratch each call (display size × budget-capped base × factor), then
     // apply the SAME memory-safety ceiling as boot, so the live path can never OOM either and there's
     // no drift from repeated relative rescales.
     var dpr = window.devicePixelRatio || 1;
     var cssW = window.innerWidth || 1280, cssH = window.innerHeight || 720;
     var dw = cssW * dpr, dh = cssH * dpr;
     var base = window.__baseScale || Math.min(1, Math.sqrt((window.__maxPixels || 4000000) / (dw * dh)));
     var scl = base * factor;

     var eff = scl / base;   // effective factor after the clamp
     if (Math.abs(eff - (window.__ssaaCurrent || 1)) < 0.02) { window.__ssaaCurrent = eff; return; }
     window.__ssaaCurrent = eff;
     if (!(window.Module && Module._omw_set_resolution)) return; // engine not up yet; boot reads omw_ss
     var rw = Math.max(320, Math.round(dw * scl)), rh = Math.max(240, Math.round(dh * scl));
     window.__renderW = rw; window.__renderH = rh;
     window.__guiScale = rw / cssW;
     append('[ssaa] ' + factor + 'x (eff ' + eff.toFixed(2) + ') -> ' + rw + 'x' + rh);
     try { Module._omw_set_resolution(rw, rh); } catch(e){ append('[ssaa err] '+e,'err'); }
   };

   // --- Keyboard capture guards (capture phase, before SDL sees them):
   //  - Tab must stay in-game (GUI navigation), not move browser focus.
   //  - Ctrl/Cmd+S is the browser save-page dialog — swallow it (in-game quicksave is F5-free).
   //  - F5/Ctrl+R reload the page mid-game — block with a hint (use the menu to quit).
   //  - Ctrl/Cmd+W cannot be blocked by content JS; the dynamic beforeunload guard (below)
   //    intercepts the actual tab close instead.
   window.addEventListener('keydown', function(e){
     var mod = e.ctrlKey || e.metaKey;

   // --- Pointer-lock helper: cursor warping is impossible in browsers — pointer lock is the
   // only correct relative-mouse model. If the engine wants relative mode but the lock was
   // refused (request arrived before a user gesture), re-request it on the next click.

         const p = canvas.requestPointerLock();

 // (root cause of "changed settings in Options, refreshed, everything reverted", and the
 // 'warning: 2 FS.syncfs operations in flight at once'). Coalesce to exactly one in-flight
 // sync plus at most one queued re-sync, so a request during a sync still gets flushed after.
 // ALL callers — JS and the C++ EM_ASM save hooks — route through this.

           // SWIM FIX (live-confirmed 2026-07-06): the residual shadow "swim" was CASCADE TRANSITIONS —
           // per-cascade texel grids are world-locked (verified by telemetry), but with 3 PSSM cascades
           // objects crossing the split boundaries get re-shadowed at a different cascade resolution as
           // the camera moves, which reads as swimming. ONE cascade = no transitions = rock-steady
           // shadows; a high-res single map makes up the resolution a cascade stack would have provided.
           // 8192 (was 16384, user request 2026-07-07): a 16384 depth map is ~1GB — the single biggest
           // memory consumer — and 8192 (~256MB) frees that headroom (e.g. for SSAA) at a still-crisp
           // texel density over the 2048 shadow range. ?shadowres=N / ?shadowmaps=N override (QA).
           'shadow map resolution = ' + ((/[?&]shadowres=(\d+)/.exec(location.search)||[])[1] || '8192') + '\n' +
           'number of shadow maps = ' + ((/[?&]shadowmaps=(\d+)/.exec(location.search)||[])[1] || '1') + '\n' +

           // object shadows: OFF by default. It WOULD fix the plank-leak (objects don't write the shadow

           '[Cells]\n' +
           'preload cell cache max = 18\n' +   // engine asked for 18 for exterior preloading
           '[Game]\n' +
           'actors processing range = 4096\n' +   // AI-process fewer distant NPCs/creatures (towns)

           // more per-object shading cost. ?maxlights=N overrides (QA); default measured for 60fps.

           // (util.cpp:shouldAddMSAAIntermediateTarget) — smoke-test ?aa=4 for water/sky regressions.

           // it's impossible on WebGL2 and the engine falls back automatically):
           // - clamp lighting=false: drop the legacy fixed-function 0..1 light clamp so point
           //   lights keep their smooth quadratic falloff instead of plateauing (OpenMW's

           'match sunlight to sun = true\n' +

           'apply lighting to environment maps = true\n' +
           // Auto normal/specular map pickup (object + terrain): a NO-OP with retail Morrowind
           // data (it ships no _n/_nh/_spec textures) but makes texture-replacer packs light
           // correctly the moment they're added to the data dir — zero cost until such textures
           // actually exist. ?nomaps=1 disables (QA).
           (/[?&]nomaps=1\b/.test(location.search) ? '' :
             ('auto use object normal maps = true\n' +
              'auto use object specular maps = true\n' +
              'auto use terrain normal maps = true\n' +
              'auto use terrain specular maps = true\n')) +
           // Soft particles: fade smoke/fire/mist where they intersect solid geometry instead of
           // a hard clipping seam. Per-pixel opaque-depth sample in the particle shader (the
           // opaque depth texture already exists on the web pipeline). ?nosoft=1 disables (QA).
           (/[?&]nosoft=1\b/.test(location.search) ? '' : 'soft particles = true\n') +
           '[General]\n' +
           // Anisotropic filtering: EXT_texture_filter_anisotropic is already enabled at context
           // creation and applied per-texture by the patched OSG. The engine default is only 4x;
           // bump the web build to 16x for crisp ground/road/floor textures at grazing angles

           // ?pp=1 enables the experimental GLES post-processing path (also sets OPENMW_ENABLE_PP
           // env — see preRun). PP renders the scene single-sample (no MSAA-depth-resolve freeze).
           // The curated chain is controllable with ?ppchain=<csv> for A/B testing:
           //   ?pp=1                       -> default chain 'adjustments' (color/contrast pass)
           //   ?pp=1&ppchain=bloomlinear,adjustments  -> bloom + color grade
           //   ?pp=1&ppchain=              -> empty chain (framework-only smoke)

           // PP now ships ENABLED by default on web (curated GLES chain verified). ?pp=0 turns it
           // off for A/B; ?ppchain=<csv> overrides the chain. The Options-menu toggle also works,
           // and since this is only a defaults layer, a user's saved setting overrides it.
           (/[?&]pp=0\b/.test(location.search)
             ? ''
             : ('[Post Processing]\nenabled = true\nchain = ' +
                (function(){ var m=/[?&]ppchain=([^&]*)/.exec(location.search);
                   return m ? decodeURIComponent(m[1]) : 'adjustments'; })() + '\n'));
         // Baseline DEFAULTS layer only. The engine reads this ('/' is an earlier active
         // config dir) as additional defaults and layers the PERSISTENT user settings from
         // /userdata/config/openmw/settings.cfg (IDBFS) on top — so Options-menu changes,
         // including a chosen resolution, override these and survive reloads. NEVER write

         append('[cfg] render resolution ' + rW + 'x' + rH);
       } catch(e){ append('[settings err] '+e,'err'); }
       FS.mkdirTree('/userdata');
       // Ask the browser for durable storage: without persist(), IndexedDB (saves, settings)

       try {
         if (navigator.storage && navigator.storage.persist)

             if (err) append('[idbfs load err] '+err,'err'); else append('[idbfs] loaded persistent /userdata');

       // --- Mount the user-picked Data Files folder (?src=local). Boot waits on 'mw-local'. ---
       function mountLocalMorrowind(){

           append('[local] mounted '+count+' files (streaming from disk)');
           // Diagnostic: report what top-level folders actually got mounted. Retail audio/voice/video
           // are LOOSE files (Sound/, Music/, Video/, Splash/) — NOT in the BSA — so if any of these
           // read 0 the picked folder is missing them (or a subfolder wasn't granted/readable).
           try {
             var __want=['sound','music','video','splash'], __log=function(m){ append(m); console.log(m); };
             FS.readdir('/mwdata').forEach(function(d){
               if (d==='.'||d==='..') return;
               var p='/mwdata/'+d; try { if (!FS.isDir(FS.stat(p).mode)) return; } catch(e){ return; }
               var n=0; (function cnt(dir){ FS.readdir(dir).forEach(function(e){ if(e==='.'||e==='..')return;

       }

       // --- Load REAL Morrowind data at runtime (esm + bsa + loose audio tar) ---
       // Fetched SEQUENTIALLY (not Promise.all) so peak JS-heap stays low, into MEMFS under

       if (!__srcLocal) try {
         // Diagnostic: ?nomw skips the 817MB Morrowind load and boots the tiny preloaded

         if (window.__FORCE_NOMW || /[?&]nomw\b/.test(location.search)){

           append('[mw] SKIPPED (nomw) — booting example-suite demo');
           throw {__skip:1};
         }

         addRunDependency('mw-data');
         // Minimal ustar extractor: writes each entry under destPrefix into MEMFS.
         function untar(buf, destPrefix){
           var u8 = new Uint8Array(buf), off = 0, n = 0;
           function str(o,len){ var s=''; for(var i=0;i<len;i++){ var c=u8[o+i]; if(c===0) break; s+=String.fromCharCode(c);} return s; }
           while (off + 512 <= u8.length){
             var name = str(off,100);
             if (name === ''){ off += 512; continue; } // zero/pad block
             var prefix = str(off+345,155);
             var full = prefix ? prefix + '/' + name : name;
             var size = parseInt(str(off+124,12).trim(),8) || 0;
             var type = u8[off+156];
             off += 512;
             // Skip macOS AppleDouble junk (._name) + __MACOSX so OpenMW doesn't try to load them.
             var base = full.substring(full.lastIndexOf('/') + 1);
             if (base.indexOf('._') === 0 || full.indexOf('__MACOSX') !== -1){ off += Math.ceil(size/512)*512; continue; }
             var path = destPrefix + full;
             if (type === 53){ try { FS.mkdirTree(path); } catch(e){} }        // '5' dir
             else if (type === 48 || type === 0){                              // '0'/'\0' file
               var dir = path.substring(0, path.lastIndexOf('/'));
               try { FS.mkdirTree(dir); } catch(e){}
               try { FS.writeFile(path, u8.subarray(off, off+size)); n++; } catch(e){}
             }
             off += Math.ceil(size/512) * 512;
           }
           return n;
         }
         // Cache-API-backed fetch with REAL progress: streams the body so the HUD can show
         // per-file % and cumulative MB (previously a multi-minute blank wait). Downloads once,
         // then persists across reloads (cache.put ignores the dev server's no-cache headers).
         // QuotaExceeded on cache.put is non-fatal: skip caching, keep playing.
         var __dlTotal = 0; // cumulative bytes this session (for the HUD)
         function fetchStreaming(url){
           return fetch(url).then(function(r){
             if(!r.ok) throw url+' HTTP '+r.status;
             var name = url.split('/').pop();
             var total = parseInt(r.headers.get('Content-Length')||'0',10);
             if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function(ab){ return {resp:r, buf:ab}; });
             var reader = r.body.getReader(), chunks = [], got = 0, lastPct = -10;
             function pump(){
               return reader.read().then(function(res){
                 if (res.done){
                   var out = new Uint8Array(got), pos = 0;
                   for (var i=0;i<chunks.length;i++){ out.set(chunks[i], pos); pos += chunks[i].length; }
                   __dlTotal += got;
                   return {resp:r, buf:out.buffer};
                 }
                 chunks.push(res.value); got += res.value.length;
                 var pct = total ? Math.floor(got*100/total) : 0;
                 if (pct >= lastPct + 5){ // update every 5% to keep the log readable
                   lastPct = pct;
                   append('[dl] ' + name + ' ' + (total ? pct+'%' : Math.round(got/1048576)+'MB')
                     + '  (session total ' + Math.round((__dlTotal+got)/1048576) + 'MB)');
                 }
                 return pump();
               });
             }
             return pump();
           });
         }
         function grab(url){
           if (!self.caches) return fetchStreaming(url).then(function(x){ return x.buf; });
           return caches.open('mwdata-v1').then(function(cache){
             return cache.match(url).then(function(hit){
               if (hit){ append('[mw] cache hit '+url); return hit.arrayBuffer(); }
               return fetchStreaming(url).then(function(x){
                 return cache.put(url, new Response(x.buf)).then(
                   function(){ return x.buf; },
                   function(e){
                     append('[cache] put failed (' + (e && e.name) + ') — continuing uncached', 'err');
                     return x.buf;
                   });
               });
             });
           });
         }
         function writeRaw(dest){ return function(b){ FS.writeFile(dest, new Uint8Array(b)); return b.byteLength; }; }
         function untarInto(label){ return function(b){ var c = untar(b, '/mwdata/'); append('[mw] '+label+': extracted '+c+' files'); }; }
         // ?stream: don't copy the BSAs into memory at all — mount them as lazy range-read
         // files (emscripten FS.createLazyFile + the server's HTTP Range support). Only the
         // bytes OpenMW actually touches are fetched/resident: cuts resident memory by the
         // ~483MB of archives and removes them from the up-front download entirely.
         var STREAM_BSA = /[?&]stream\b/.test(location.search);
         if (STREAM_BSA){ try { StreamFS.init(); } catch(e){ append('[mw] streamfs unavailable: '+e, 'err'); STREAM_BSA = false; } }
         function addBsa(name){
           if (STREAM_BSA){
             // Probe the size with a 1-byte range request, then mount the worker-backed
             // streaming file (see streamfs.js). No archive bytes resident up-front.
             return fetch('mwdata/' + name, { headers: { Range: 'bytes=0-0' } }).then(function(r){
               var cr = r.headers.get('Content-Range');
               var size = cr ? parseInt(cr.split('/')[1], 10) : NaN;
               if (!size) throw 'no Content-Range for ' + name;
               StreamFS.mount('/mwdata/' + name, 'mwdata/' + name, size);
               append('[mw] ' + name + ' mounted streaming (' + Math.round(size/1048576) + 'MB on demand)');
             }).catch(function(e){
               append('[mw] stream mount failed for ' + name + ', falling back: ' + e, 'err');
               return grab('mwdata/' + name).then(writeRaw('/mwdata/' + name));
             });
           }
           return grab('mwdata/' + name).then(writeRaw('/mwdata/' + name));
         }
         append('[mw] loading Morrowind (cached after first run)…');
         grab('mwdata/Morrowind.esm').then(writeRaw('/mwdata/Morrowind.esm'))
         .then(function(){ append('[mw] esm ok; bsa (310MB)…'); return addBsa('Morrowind.bsa'); })
         .then(function(){ append('[mw] bsa ok; sound+music (81MB)…'); return grab('mwdata/mwaudio.tar').then(untarInto('audio')); })
         .then(function(){ append('[mw] voice (111MB)…'); return grab('mwdata/mwvoice.tar').then(untarInto('voice')); })
         .then(function(){ append('[mw] splash+fonts (33MB)…'); return grab('mwdata/mwextra.tar').then(untarInto('extra')); })
         .then(function(){ append('[mw] Tribunal (65MB)…'); return grab('mwdata/Tribunal.esm').then(writeRaw('/mwdata/Tribunal.esm')); })
         .then(function(){ return addBsa('Tribunal.bsa'); })
         .then(function(){ append('[mw] Bloodmoon (121MB)…'); return grab('mwdata/Bloodmoon.esm').then(writeRaw('/mwdata/Bloodmoon.esm')); })
         .then(function(){ return addBsa('Bloodmoon.bsa'); })
         .then(function(){ append('[mw] Bloodmoon sounds (28MB)…'); return grab('mwdata/mwbmsound.tar').then(untarInto('bm-sound')); })
         .then(function(){
           // Videos ON BY DEFAULT (?novid to opt out). Playback is cooperative under
           // emscripten (WindowManager::playVideo starts the decode pthreads and returns;
           // Engine::frame drives updateVideoPlayback each tick) — the old blocking-loop
           // futex deadlock is fixed. The original .bik files play in-engine via the native
           // Bink decoder (FFmpeg --enable-decoder=bink); nothing is transcoded.
           if (/[?&]novid\b/.test(location.search)){ append('[mw] videos skipped (?novid)'); window.__noMovies = true; return; }
           append('[mw] videos (40MB, played on the fly)…'); return grab('mwdata/mwvideo.tar').then(untarInto('video'));
         })
         .then(function(){
           // Rewrite openmw.cfg once the preloaded copy is present in MEMFS. Full GOTY load order,
           // and replace the OpenMW example-suite movie names with Morrowind's real .bik files
           // (OpenMW decodes Bink natively — no conversion, the originals play as-is).
           (function waitCfg(){
             if (FS.analyzePath('/openmw.cfg').exists){
               var cfg = FS.readFile('/openmw.cfg', {encoding:'utf8'}).split('\n').filter(function(l){
                 return !/^content=/.test(l) && !/^data=\/gamedata\s*$/.test(l) && !/^fallback-archive=/.test(l)
                     && !/^fallback=Movies_/.test(l);
               });
               cfg.push('data=/mwdata',
                        // Make the IDBFS dir an ACTIVE config path so it becomes the engine's
                        // user-config dir (getUserConfigPath() = last active config path). The
                        // engine then READS user settings from and WRITES them to this persistent
                        // dir — Options changes, keybindings, Lua storage survive reloads. The
                        // baseline /settings.cfg (front of the chain) still applies as defaults.
                        'config="/userdata/config/openmw"',
                        'fallback-archive=Morrowind.bsa', 'fallback-archive=Tribunal.bsa', 'fallback-archive=Bloodmoon.bsa',
                        'content=Morrowind.esm', 'content=Tribunal.esm', 'content=Bloodmoon.esm');
               if (!window.__noMovies)
                 cfg.push('fallback=Movies_Company_Logo,bethesda logo.bik',
                          'fallback=Movies_Morrowind_Logo,mw_logo.bik',
                          'fallback=Movies_New_Game,mw_intro.bik');
               FS.writeFile('/openmw.cfg', cfg.join('\n'));
               append('[mw] READY -> Morrowind GOTY (base+Tribunal+Bloodmoon, audio+voice+video)');
               removeRunDependency('mw-data');
             } else { setTimeout(waitCfg, 25); }
           })();
         }).catch(function(e){
           // A file failed to download/unpack. Do NOT removeRunDependency here: booting now would
           // start the engine on the still-baked example-suite openmw.cfg (data=/gamedata) — i.e. the
           // WRONG game, and any save would write to the wrong state. Hard-stop with a clear message
           // and keep the run dependency held so the engine never boots on the stale config.
           append('[mw load err] '+e,'err');
           fatalOverlay('Could not load Morrowind data',
             'A game file failed to download or unpack (' + (e && e.message || e) + '). '
             + 'Check your connection and reload — your saves are safe.');
         });
       } catch(e){ if(!(e&&e.__skip)) append('[mw setup err] '+e,'err'); }

       append('[preRun] env + user dirs ready');
     } catch(e){ append('[preRun error] '+e,'err'); }
   }],
   print: (t)=>{ console.log(t); append(t); },
   printErr: (t)=>{ console.warn(t); append(t,'err'); },
   onAbort: function(w){
     append('ABORT: '+w,'err');
     try { if (window.__omwSync) window.__omwSync(); } catch(e){}
     fatalOverlay('The game hit a fatal error', String(w||'') +
       (String(w).toLowerCase().indexOf('memory') >= 0
        ? ' — the browser could not grow WebAssembly memory. Close other tabs/apps and reload.'
        : ' — your saves are safe. Reloading may fix it.'));
   },
   setStatus: (t)=>{ if(t){ append('[status] '+t);
     // Emscripten reports the wasm/.data preload as "Downloading data... (x/y)" — feed the bar.
     try {
       var m = /\((\d+)\s*\/\s*(\d+)\)/.exec(t);
       if (window.__omwLoading){
         if (m && +m[2] > 0) window.__omwLoading.set(Math.round(+m[1]*100/+m[2]), 'Downloading');
         else window.__omwLoading.set(null, t.replace(/\.\.\.$/, ''));
       }
     } catch(e){}
   } },
   onRuntimeInitialized: function(){
     // Drive the engine frame from a MessageChannel: unlike setTimeout/requestAnimationFrame,
     // MessageChannel messages are NOT throttled when the tab is hidden/backgrounded, so the
     // game keeps running (and stays interactive) even in the background. omw_pump_frame() is a
     // no-op until the C++ main loop registers itself; the engine's own FrameRateLimiter paces it.
     try {
       var mc = new MessageChannel();
       // FPS instrumentation: count real engine frames + per-frame wall time.
       window.__fps = 0; window.__frameMs = 0;
       var __frames = 0, __t0 = performance.now(), __accum = 0;
       // SINGLE frame driver (the engine no longer registers emscripten_set_main_loop):
       // visible tab -> next tick scheduled via requestAnimationFrame (vsync-aligned, smooth);
       // hidden tab  -> direct postMessage (unthrottled, game keeps running in background).
       var scheduled = false;
       function scheduleNext(){
         if (scheduled) return; scheduled = true;
         // Visible: vsync-align via rAF. Hidden: pace with a timer (~30fps target; browsers throttle
         // background timers further) instead of an immediate postMessage — an unpaced background
         // MessageChannel loop pins a CPU core at 100% for a tab nobody is looking at.
         if (document.hidden) setTimeout(function(){ mc.port2.postMessage(0); }, 33);
         else requestAnimationFrame(function(){ mc.port2.postMessage(0); });
       }
       mc.port1.onmessage = function(){
         scheduled = false;
         var a = performance.now();
         try { if (Module._omw_pump_frame) Module._omw_pump_frame(); } catch(e){}
         var b = performance.now();
         __frames++; __accum += (b - a);
         var dt = b - __t0;
         if (dt >= 1000){ window.__fps = Math.round(__frames*1000/dt); window.__frameMs = +(__accum/__frames).toFixed(2); __frames = 0; __accum = 0; __t0 = b; }
         scheduleNext();
       };
       // If the tab hides while an rAF-scheduled tick is frozen, take over directly.
       // (The stale rAF firing later causes at most one harmless extra tick.)
       document.addEventListener('visibilitychange', function(){
         if (document.hidden && scheduled) mc.port2.postMessage(0);
       });
       mc.port2.postMessage(0);
       append('[pump] frame pump started (rAF-paced when visible)');
     } catch(e){ append('[pump error] '+e,'err'); }
   },
 };
 window.addEventListener('error', function(e){ append('window error: '+e.message,'err'); if(e.error&&e.error.stack) append('STACK:\n'+e.error.stack,'err'); showLogOnce(); });
 // Pointer-lock re-requests are browser rate-limited ("cannot be acquired immediately after the
 // user has exited the lock"). SDL's own requestPointerLock() promise has no .catch, so that
 // rejection surfaces as console noise right when the game grabs the mouse (e.g. new-game start).
 // Expected + self-healing (the pointerdown helper re-requests on the next click) — silence it.
 window.addEventListener('unhandledrejection', function(e){
   // Filter the benign, self-healing pointer-lock rejection FIRST (SDL re-requests on the next
   // click). e.preventDefault() only suppresses the browser's own console logging, so this must be
   // the ONLY unhandledrejection handler or the filtered case still gets logged/opens the debug log.
   if (String(e.reason && e.reason.message || e.reason).indexOf('Pointer lock') !== -1) { e.preventDefault(); return; }
   append('unhandled rejection: '+(e.reason && e.reason.message || e.reason),'err');
   showLogOnce();
 });
</script>
<script src="streamfs.js"></script>
<script>
  // Load the version-stamped engine loader from the versioned dir; its wasm/data follow via
  // Module.locateFile. (streamfs.js above is unversioned + loaded first — StreamFS is used in preRun.)
  (function(){
    var s = document.createElement('script');
    s.src = __ENGINE_DIR + 'openmw.js';
    s.onerror = function(){ if (typeof fatalOverlay === 'function') fatalOverlay('Engine failed to load',
      'Could not load the game engine (' + __ENGINE_DIR + 'openmw.js). Reload to try again.'); };
    document.body.appendChild(s);
  })();
</script>
