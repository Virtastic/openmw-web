#
# Publishes the self-hosting image to ghcr.io.
#
# WHY THIS EXISTS. The multiplayer server refuses to start without a headless OpenMW to
# simulate NPCs, and that binary is compiled from the engine source in this repo. Asking
# every self-hoster to run that build turns "up in two minutes" into an afternoon on a
# machine that may not have the memory for it (see Dockerfile.simpeer's own notes on
# concurrency and RAM). So it is built once, here, and pulled by the root docker-compose.yml.
#
# Deliberately NOT the same image the Virtastic deployment uses. That one is built and
# tagged on a self-hosted runner by deploy-mp.yml and never leaves the box. This is the
# public artifact, built from the same Dockerfile target so the two cannot drift.

name: publish mp image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish alongside latest (e.g. 1.1.0)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  # One publish at a time: two runs pushing :latest would race to decide which build wins.
  group: publish-mp-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Virtastic/openmw-web'
    runs-on: ubuntu-latest
    # Compiling OpenMW is not quick. The default 360-minute ceiling is plenty, but being
    # explicit means a wedged build fails rather than occupying a runner all day.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The engine source lives in this repo; a shallow clone is all the build needs.
          fetch-depth: 1

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/virtastic/openmw-mp
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          file: server/Dockerfile.simpeer
          target: tier2
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only, for now. An arm64 build would serve Apple Silicon natively, but it
          # would be a full second compile of the engine under emulation on a hosted runner,
          # which is hours. Docker Desktop runs the amd64 image under Rosetta on those
          # machines; add linux/arm64 here once a native arm runner is available.
          platforms: linux/amd64
          # Registry cache: the engine layers dominate and change rarely, so a cache hit
          # turns a multi-hour build into minutes for a release that only touched the server.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_JOBS=4

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Published'
            echo ''
            echo 'Self-hosters get this by running `./setup.sh` (or `.\setup.ps1`), which'
            echo 'pulls it through the root docker-compose.yml.'
            echo ''
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
