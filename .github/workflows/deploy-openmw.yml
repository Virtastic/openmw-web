# SPDX-License-Identifier: GPL-3.0-or-later
# Build the openmw-web container image and publish it to GHCR. The shared box then pulls it
# (docker compose pull openmw && up -d), or Watchtower rolls it automatically. The box itself
# is a manually-managed shared resource and is intentionally NOT touched by this workflow.
#
# The large engine artifacts (openmw.wasm/.data/.js) are gitignored, so they're pulled from a
# GitHub Release published after a local build:
#     ./wasm-build/link-openmw.sh && ./wasm-build/make_br.sh
#     cp build-wasm/openmw.{js,wasm,data} play/
#     gh release create build-YYYYMMDD play/openmw.js play/openmw.wasm play/openmw.data
name: build-openmw-image
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the engine artifacts (blank = latest)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'Virtastic/openmw-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch engine artifacts from the release
        id: bundle
        # Pass context through env, never interpolate ${{ }} into the shell body (a crafted release
        # tag name could otherwise inject commands).
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          [ -z "$TAG" ] && [ "$EVENT_NAME" = "release" ] && TAG="$RELEASE_TAG"
          [ -z "$TAG" ] && TAG=$(gh release view --json tagName -q .tagName)
          # The release ships the whole served web root as one zip (the engine is content-
          # versioned under e/<hash>/, never loose at the root), so that is what the image is
          # built from. Asking for loose openmw.* assets failed every run since versioning landed.
          rm -rf dist && mkdir -p dist/web
          gh release download "$TAG" --dir dist --pattern "openmw-web-$TAG.zip"
          unzip -q "dist/openmw-web-$TAG.zip" -d dist/web
          test -f dist/web/index.html || { echo "FATAL: bundle has no index.html" >&2; exit 1; }
          ls dist/web/e/*/openmw.wasm >/dev/null || { echo "FATAL: bundle has no e/<hash>/openmw.wasm" >&2; exit 1; }
          echo "engine dir: $(ls -d dist/web/e/*/)"
          # The version this image IS, for the tags below. Without it the only tags published
          # were `latest` and `sha-<short>`: nothing to pin, and a rollback meant hunting for a
          # commit hash. Emitted with and without the leading v, because an image tag
          # conventionally carries the bare version while the release is vX.Y.Z.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}   # lowercased automatically
          tags: |
            type=raw,value=latest
            type=sha
            # THE VERSION THIS IMAGE IS. `latest` says nothing about what is inside it and a
            # sha says nothing a human can act on, so an operator had no way to pin a release
            # or name the one to roll back to. Both forms, since the release is vX.Y.Z and an
            # image tag is conventionally the bare version.
            type=raw,value=${{ steps.bundle.outputs.version }}
            type=raw,value=${{ steps.bundle.outputs.tag }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
