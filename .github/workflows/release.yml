name: release (grab-and-go bundles)

# Builds the engine exactly like the live deploy and publishes two assets to the
# GitHub Release for the pushed tag:
#   openmw-web-<tag>.zip     — prebuilt engine + web shell + demo: unzip and serve
#   openmw-web-src-<tag>.tar.gz  — the exact source snapshot (GPLv3 Complete Corresponding Source)
# plus SHA256SUMS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

concurrency:
  group: release-openmw-web
  cancel-in-progress: false

permissions:
  contents: write   # create the release + upload assets

jobs:
  release:
    # Public-repo hardening: never run on forks or PR-triggered events — this job
    # executes on the production VPS runner.
    if: github.repository == 'Virtastic/openmw-web' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "FATAL: tag $TAG not found" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Same staging as deploy-ovh.yml: the demo data is gitignored; the runner's
      # ~/morrowind-src is the canonical source of truth for it.
      - name: Stage demo data into build context
        run: |
          test -n "$(ls -A "$HOME/morrowind-src/fsroot/gamedata" 2>/dev/null)" \
            || { echo "FATAL: ~/morrowind-src/fsroot/gamedata missing on the runner." >&2; exit 1; }
          mkdir -p fsroot/gamedata
          rsync -a --delete "$HOME/morrowind-src/fsroot/gamedata/" fsroot/gamedata/
          # ICU data is gitignored too (fsroot/*.dat) and the engine aborts at boot without it.
          test -f "$HOME/morrowind-src/fsroot/icudt68l.dat" \
            || { echo "FATAL: ~/morrowind-src/fsroot/icudt68l.dat missing on the runner." >&2; exit 1; }
          cp "$HOME/morrowind-src/fsroot/icudt68l.dat" fsroot/
          # The demo must carry its attribution files — refuse to release without them.
          for f in CREDITS-DEMO-DATA.txt ExampleSuiteAuthors.txt LinksToLicenses.txt; do
            test -f "fsroot/gamedata/$f" || { echo "FATAL: fsroot/gamedata/$f missing — demo attribution incomplete." >&2; exit 1; }
          done
          echo "staged $(find fsroot/gamedata -type f | wc -l) demo files"

      - name: Build engine image
        run: DOCKER_BUILDKIT=1 docker build --network=host -t morrowind:release -f Dockerfile .

      - name: Extract web root
        run: |
          set -e
          rm -rf dist && mkdir -p dist/web
          CID=$(docker create morrowind:release)
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          # Copy the ENTIRE served web root, not individual files: index.html (content-version
          # stamped by wasm-build/version-engine.sh), launcher.html, streamfs.js, and the versioned
          # engine at e/<hash>/openmw.{js,wasm,data}(+.br). The engine is no longer at /srv root.
          docker cp "$CID:/srv/." dist/web/
          echo "--- web root ---"; ls -la dist/web
          echo "--- engine dir ---"; ls -la dist/web/e/*/

      - name: Assemble web bundle
        run: |
          set -e
          TAG='${{ steps.tag.outputs.tag }}'
          # index.html / launcher.html / streamfs.js and the versioned engine already came from the
          # container above. index.html is the STAMPED copy — do NOT overwrite it with the source one.
          # Add only the files the container doesn't serve: the dev server + its env, and legal/demo docs.
          cp play/server.py play/.env.example dist/web/
          cp LICENSE NOTICE AUTHORS.md THIRD-PARTY-LICENSES.md SELF_HOSTING.md dist/web/
          cp fsroot/gamedata/CREDITS-DEMO-DATA.txt fsroot/gamedata/ExampleSuiteAuthors.txt fsroot/gamedata/LinksToLicenses.txt dist/web/
          # No proprietary content may ever appear in a release asset (recurse — engine is under e/).
          ! find dist/web -type f | grep -qiE 'morrowind\.(esm|bsa)|tribunal|bloodmoon|mwdata'
          # python3 -m zipfile: the runner has no `zip` binary. Run from inside web/ so entries land at
          # the zip root (unzip → serve, no nested dir). '*' recurses into e/ but skips dotfiles, so pass
          # .env.example explicitly.
          (cd dist/web && python3 -m zipfile -c "../openmw-web-$TAG.zip" * .env.example)

      - name: Assemble source tarball (Complete Corresponding Source)
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          # git archive packs tracked files only — game data, deps caches, and local
          # blobs are gitignored and can never leak through this path.
          git archive --format=tar.gz --prefix="openmw-web-$TAG/" -o "dist/openmw-web-src-$TAG.tar.gz" "$TAG"
          tar tzf "dist/openmw-web-src-$TAG.tar.gz" | grep -qiE 'mwdata|\.esm$|\.bsa$' && { echo "FATAL: suspicious file in source tarball" >&2; exit 1; } || true

      - name: Checksums
        run: cd dist && shasum -a 256 openmw-web-*.zip openmw-web-*.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenMW-Web ${{ steps.tag.outputs.tag }} — by Virtastic"
          body: |
            **Play Morrowind in your browser.** Prebuilt WebAssembly engine — unzip the web bundle, run `python3 server.py`, open desktop Chrome. See [SELF_HOSTING.md](https://github.com/Virtastic/openmw-web/blob/${{ steps.tag.outputs.tag }}/SELF_HOSTING.md).

            - `openmw-web-*.zip` — grab-and-go: prebuilt engine + web shell + free demo world
            - `openmw-web-src-*.tar.gz` — the exact source snapshot (GPLv3 Corresponding Source)

            WASM port © 2025–2026 [Virtastic](https://virtastic.app) · GPL-3.0-or-later · No Morrowind game data included.
          files: |
            dist/openmw-web-${{ steps.tag.outputs.tag }}.zip
            dist/openmw-web-src-${{ steps.tag.outputs.tag }}.tar.gz
            dist/SHA256SUMS
