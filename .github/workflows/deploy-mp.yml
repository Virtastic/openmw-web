name: deploy-mp (multiplayer server)

# Deploys the openmw-mp multiplayer server to the OVH VPS via the same self-hosted runner as
# deploy-ovh.yml. Path-filtered: server pushes deploy in ~1 min without touching the ~13-min
# engine build, and vice versa. The runner executes ON the VPS with docker access.
#
# Prereqs on the box (one-time): the shared `edge-caddy` container + `nostalgia` network, and
# /opt/edge/certs/virtastic.{crt,key}. NO dedicated DNS record or vhost: the gateway is reached
# through the game's own Caddy on the game's origin, because index.html will not hand its
# session ticket to a gateway on a different hostname (AGENTS.md, "One origin"). Persistent
# state lives in /opt/openmw-mp/data - this workflow NEVER touches that dir's contents.
# See docs/PRODUCTION-BRINGUP.md for the full first-deploy checklist.
on:
  push:
    branches: [ovhcloud]
    paths:
      - 'server/**'
      # The sim peer is COMPILED from openmw/ into this image (Dockerfile.simpeer), so an
      # engine change that does not rebuild here leaves the peer simulating with a different
      # engine than the clients are running.
      - 'openmw/**'
      - 'deploy/upload.virtastic.app.caddy'
      - '.github/workflows/deploy-mp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ovh-mp
  cancel-in-progress: false

jobs:
  deploy:
    # Public-repo hardening: never run on forks or PR-triggered events — this job
    # executes on the production VPS runner.
    if: github.repository == 'Virtastic/openmw-web' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      # Hard gate: the test stage runs typecheck + the full unit/integration suite inside the
      # build. A red suite never reaches the box. --network=host: npm ci needs egress, which
      # the default build bridge lacks here (same reason as deploy-ovh.yml).
      - name: Test gate
        run: DOCKER_BUILDKIT=1 docker build --network=host --target test -f server/Dockerfile server/

      - name: Build image
        run: |
          # Dockerfile.simpeer --target tier2, from the REPO ROOT. NOT server/Dockerfile:
          # ci/jenkins/build-server.sh says it outright - "that alpine/musl image has no peer
          # binary and cannot run the glibc one". This workflow built it anyway, so the first
          # production multiplayer deploy came up and died with "no sim-peer binary". It was
          # never caught because production had never deployed multiplayer before.
          # The context is the repo root because the image compiles the OpenMW fork, so it
          # needs openmw/ in the context.
          DOCKER_BUILDKIT=1 docker build --network=host \
            -f server/Dockerfile.simpeer --target tier2 -t openmw-mp:ovh .
          # Assert the peer is actually in there, like the Jenkins build does. Without it the
          # server starts, finds no binary and exits, which is a crash loop rather than a
          # degraded mode - so failing here is strictly better than failing on the box.
          docker run --rm --entrypoint sh openmw-mp:ovh -c 'command -v openmw' \
            || { echo "FATAL: openmw-mp:ovh has no openmw peer binary" >&2; exit 1; }

      - name: Sync compose to /opt/openmw-mp
        run: |
          sudo mkdir -p /opt/openmw-mp/data
          sudo cp server/docker-compose.prod.yml /opt/openmw-mp/docker-compose.prod.yml

      # Drain BEFORE the swap. `compose up -d` on a changed image recreates the container,
      # which kills connected players mid-session with no warning frame. `compose stop`
      # sends SIGTERM and honours stop_grace_period (30s), and the server's SIGTERM path
      # broadcasts SessionDisconnect SHUTDOWN to every session and flushes all state before
      # exiting — so players see "server shutting down" and reconnect cleanly instead of
      # having the socket vanish. Timeout is one second under the grace period so compose,
      # not us, owns the SIGKILL. First deploy (no container yet) is a no-op.
      - name: Drain connected players
        env:
          COMPOSE_FILE: /opt/openmw-mp/docker-compose.prod.yml
        run: |
          set -e
          if [ -n "$(docker ps -q -f name='^openmw-mp$')" ]; then
            docker compose -f "$COMPOSE_FILE" stop -t 29 openmw-mp
            echo "drained: previous container stopped gracefully"
          else
            echo "no running container to drain"
          fi

      - name: Start / update container
        run: docker compose -f /opt/openmw-mp/docker-compose.prod.yml up -d

      # The file-mode upload host (see the vhost's own header for why it exists). Its cert
      # and DNS record are one-time box setup (docs/PRODUCTION-BRINGUP.md §6); the vhost
      # itself is pipeline-owned like morrowind.caddy.
      - name: Install upload-host edge vhost
        run: sudo cp deploy/upload.virtastic.app.caddy /opt/edge/sites/upload.virtastic.app.caddy

      # Validate, then restart the shared edge to apply (admin API disabled -> no `caddy
      # reload`; restart re-reads the Caddyfile, ~3s blip). Validate first to protect the
      # co-tenant sites.
      - name: Apply edge config
        run: |
          docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
          docker restart edge-caddy

      # Gate 1 — container liveness on the shared network.
      - name: Health check (container)
        run: |
          sleep 4
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS http://openmw-mp:8080/healthz | grep -q ok

      # Gate 1b — storage is what the config asked for. A configured [locker] endpoint with
      # no S3 keys used to fall back to filesystem storage with one info line: uploads then
      # rode the site origin through Cloudflare, whose free-plan 100 MB body cap killed every
      # BSA/media upload at the edge — invisible in server logs, and shipped that way for a
      # month. The server now logs locker.s3_creds_missing at error level; a deploy that
      # boots into that state is broken and must not go green. (compose up -d recreated the
      # container above, so these logs are this boot's, not history.)
      - name: Health check (locker storage mode)
        run: |
          if docker logs openmw-mp 2>&1 | grep -q 'locker.s3_creds_missing'; then
            echo "FATAL: [locker] endpoint is configured but S3 credentials are missing" >&2
            echo "       (stage them in /opt/openmw-mp/data/s3.env — docs/PRODUCTION-BRINGUP.md §3)" >&2
            exit 1
          fi

      # Gate 2 — protocol-level: a real omw-mp/1 hello through the container's WS endpoint.
      # Zero-dep bot (Node's global WebSocket) run inside the freshly built image, so it needs
      # no node on the runner and no extra deps.
      - name: Health check (protocol)
        run: |
          docker run --rm --network nostalgia \
            -v "$PWD/server/bots:/bots:ro" \
            openmw-mp:ovh node /bots/healthcheck.mjs ws://openmw-mp:8080/ws

      # Gate 3 - the edge path a PLAYER actually takes. The game page and the gateway are one
      # origin (AGENTS.md, "One origin"): index.html refuses to hand its session ticket to a
      # gateway whose hostname differs from the page's, so there is no separate mp.<domain> to
      # test. This used to curl an mp.virtastic.app vhost that no client could ever use, and
      # which proxied the gateway with NO path filter - exposing /healthz and /status, which
      # the real same-origin config deliberately withholds. Caddy routes on the Host header, so
      # its lack of a DNS record protected nothing.
      #
      # --resolve to 127.0.0.1 bypasses Cloudflare (same rationale as deploy-ovh.yml); -k
      # because the edge presents the Cloudflare Origin CA cert.
      - name: Health check (edge, the path players use)
        run: |
          set -e
          E() { curl -sS -k --resolve morrowind.virtastic.app:443:127.0.0.1 "$@"; }
          for i in $(seq 1 12); do
            E -f -o /dev/null https://morrowind.virtastic.app/auth/providers && break
            echo "edge not ready yet ($i)..."; sleep 3
          done
          # Proves the gateway is reachable THROUGH the game's own Caddy, which is the only way
          # a browser reaches it. /healthz and /status are deliberately not exposed here.
          E -f https://morrowind.virtastic.app/auth/providers | tee /dev/stderr | grep -q '"providers"'
          # The gameplay socket, on the origin the client dials. The upgrade MUST carry the
          # omw-mp.1 subprotocol or the server rejects the handshake.
          code=$(E -o /dev/null -w '%{http_code}' --http1.1 \
            -H "Connection: Upgrade" -H "Upgrade: websocket" \
            -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: aGVhbHRoY2hlY2sxNg==" \
            -H "Sec-WebSocket-Protocol: omw-mp.1" \
            https://morrowind.virtastic.app/w/vvardenfell)
          test "$code" = 101 || { echo "FATAL: WS upgrade at the edge returned HTTP $code (want 101)" >&2; exit 1; }
          echo "edge health OK (101 upgrade on /w/ + providers)"

      # No Cloudflare purge: nothing this service serves is cacheable.
