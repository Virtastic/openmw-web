name: deploy-ovh (morrowind.virtastic.app)

# Deploys the OpenMW-Web game to the OVH VPS via the self-hosted runner in the Virtastic org.
# The runner executes ON the VPS with docker access, so steps use docker/docker compose directly.
#
# Prereqs on the box (one-time): the `openmw-builder:1` image (see Dockerfile.builder), the shared
# `edge-caddy` container + `nostalgia` network, and /opt/edge/certs/virtastic.{crt,key}.
# NOTE: the deploy image bakes fsroot/gamedata (the ?nomw demo) into openmw.data — that dir is
# gitignored, so a clean `actions/checkout` will NOT include it. Ensure fsroot/gamedata is present
# in the build context (e.g. rsynced onto the runner workspace) or the demo won't be baked.
on:
  push:
    branches: [ovhcloud]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-morrowind
  cancel-in-progress: false

jobs:
  deploy:
    # Public-repo hardening: never run on forks or PR-triggered events — this job
    # executes on the production VPS runner.
    if: github.repository == 'Virtastic/openmw-web' && github.event_name != 'pull_request'
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Stage the gitignored ?nomw demo data (fsroot/gamedata) from the box's canonical source tree
      # into the build context — a clean checkout omits it, and the Dockerfile now FAILS LOUD rather
      # than baking an empty demo. ~/morrowind-src is the rsync'd source of truth on this runner.
      - name: Stage demo data into build context
        run: |
          test -n "$(ls -A "$HOME/morrowind-src/fsroot/gamedata" 2>/dev/null)" \
            || { echo "FATAL: ~/morrowind-src/fsroot/gamedata missing on the runner — cannot bake the ?nomw demo." >&2; exit 1; }
          mkdir -p fsroot/gamedata
          rsync -a --delete "$HOME/morrowind-src/fsroot/gamedata/" fsroot/gamedata/
          # ICU data is gitignored too (fsroot/*.dat) and the engine aborts at boot without it.
          test -f "$HOME/morrowind-src/fsroot/icudt68l.dat" \
            || { echo "FATAL: ~/morrowind-src/fsroot/icudt68l.dat missing on the runner." >&2; exit 1; }
          cp "$HOME/morrowind-src/fsroot/icudt68l.dat" fsroot/
          echo "staged $(find fsroot/gamedata -type f | wc -l) demo files + icudt68l.dat"

      # Incremental OpenMW build FROM the prebaked openmw-builder image. --network=host: OpenMW's
      # cmake FetchContent (recastnavigation) needs egress, which the default build bridge lacks here.
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build --network=host -t morrowind:ovh -f Dockerfile .

      # Remember whether the compose file changed: only then does the container need recreating.
      - name: Sync compose to /opt/morrowind
        run: |
          sudo mkdir -p /opt/morrowind/data
          if ! sudo cmp -s docker-compose.prod.yml /opt/morrowind/docker-compose.prod.yml; then
            echo "COMPOSE_CHANGED=1" >> "$GITHUB_ENV"
            sudo cp docker-compose.prod.yml /opt/morrowind/docker-compose.prod.yml
          fi

      # Performance asset pack (MOP + Project Atlas). It goes on the READ-ONLY DATA VOLUME
      # (/opt/morrowind/data -> /srv/data), never into the image: it is 114MB and changes far less
      # often than the engine, so baking it in would add it to every 13-minute rebuild and to every
      # image layer. index.html probes moddata/ then data/, so /srv/data/ is found with no code
      # change. Gitignored, so it comes from the runner's canonical tree like the demo data.
      # FATAL if absent: shipping a deploy that silently lacks it means production and the release
      # bundle are different builds.
      - name: Stage performance asset pack onto the data volume
        run: |
          SRC="$HOME/morrowind-src/play/moddata/openmw-web-assets.bsa"
          test -f "$SRC" \
            || { echo "FATAL: $SRC missing on the runner (build it with wasm-build/build-assetpack.py)." >&2; exit 1; }
          # Copy only when it actually differs, so a redeploy doesn't rewrite 114MB for nothing.
          if ! sudo cmp -s "$SRC" /opt/morrowind/data/openmw-web-assets.bsa; then
            sudo cp "$SRC" /opt/morrowind/data/openmw-web-assets.bsa.tmp
            sudo mv /opt/morrowind/data/openmw-web-assets.bsa.tmp /opt/morrowind/data/openmw-web-assets.bsa
            echo "asset pack updated ($(du -m "$SRC" | cut -f1) MB)"
          else
            echo "asset pack already current"
          fi
          sudo chmod 0644 /opt/morrowind/data/openmw-web-assets.bsa

      # Drop the vhost into the shared edge's sites dir (imported by /opt/edge/Caddyfile), only
      # when it changed: applying it means restarting the edge, which drops every game socket.
      - name: Install edge vhost
        run: |
          if ! sudo cmp -s deploy/morrowind.caddy /opt/edge/sites/morrowind.caddy; then
            sudo cp deploy/morrowind.caddy /opt/edge/sites/morrowind.caddy
            echo "EDGE_CHANGED=1" >> "$GITHUB_ENV"
          fi

      # This container proxies the game WebSocket, so recreating it drops every connected player
      # (2026-10-27: a 1.7.15 deploy put a live player through two reconnects). Recreate only when
      # it isn't running or its compose changed. Otherwise copy the new image's /srv into the
      # running container and swap each file in with a rename (same overlay fs, so atomic), then
      # reload Caddy if its config changed; stream_close_delay keeps the old sockets open.
      # ponytail: the running container keeps its old image id (and caddy binary) until the next
      # compose change; force a recreate with `docker rm -f morrowind` before a deploy if needed.
      - name: Start / update container
        run: |
          set -e
          COMPOSE=/opt/morrowind/docker-compose.prod.yml
          if [ -n "${COMPOSE_CHANGED:-}" ] || [ -z "$(docker ps -q -f name='^morrowind$')" ]; then
            docker compose -f "$COMPOSE" up -d
            exit 0
          fi
          docker rm -f morrowind-next >/dev/null 2>&1 || true
          docker create --name morrowind-next morrowind:ovh >/dev/null
          trap 'docker rm -f morrowind-next >/dev/null 2>&1 || true' EXIT
          docker exec morrowind rm -rf /tmp/next
          docker exec morrowind mkdir -p /tmp/next/etc
          docker cp morrowind-next:/srv - | docker cp - morrowind:/tmp/next
          docker cp morrowind-next:/etc/caddy/Caddyfile - | docker cp - morrowind:/tmp/next/etc
          docker exec morrowind sh -euc '
            cd /tmp/next/srv
            prev=$(cat /srv/engine-version.txt)
            for d in e/*; do [ -e "/srv/$d" ] || mv "$d" "/srv/$d"; done
            for f in *; do
              case "$f" in data|e) ;; *) mv -f "$f" "/srv/$f" ;; esac
            done
            # Keep the new engine and the one tabs may still be loading; each is hundreds of MB.
            cur=$(cat /srv/engine-version.txt)
            for d in /srv/e/*; do
              case "${d##*/}" in "$cur"|"$prev") ;; *) rm -rf "$d" ;; esac
            done
            if ! cmp -s /tmp/next/etc/Caddyfile /etc/caddy/Caddyfile; then
              caddy validate --config /tmp/next/etc/Caddyfile --adapter caddyfile
              cp /tmp/next/etc/Caddyfile /etc/caddy/Caddyfile
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              echo "caddy config reloaded"
            fi
            rm -rf /tmp/next
          '
          echo "hot-swapped /srv into the running container (engine $(docker exec morrowind cat /srv/engine-version.txt))"

      # Validate, then restart the shared edge to apply (admin API is disabled, so `caddy reload`
      # can't be used — restart re-reads the Caddyfile; ~3s blip, drops every socket, so only
      # when the vhost changed). Validate first to protect the other sites on this edge.
      - name: Apply edge config
        if: env.EDGE_CHANGED == '1'
        run: |
          docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
          docker restart edge-caddy

      # Fast internal gate: the container itself answers 200 + COOP on the shared network.
      - name: Health check (container)
        run: |
          sleep 4
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS -D - -o /dev/null http://morrowind:8080/ \
            | tee /dev/stderr | grep -qi '^cross-origin-opener-policy: same-origin'
          # The asset pack must actually be SERVED, not merely present on the volume — a wrong mount
          # or permissions would otherwise pass silently, since index.html degrades gracefully when
          # it can't find it. Range-probe it the same way the page does, and require a byte count.
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS -D - -o /dev/null -H 'Range: bytes=0-0' http://morrowind:8080/data/openmw-web-assets.bsa \
            | tee /dev/stderr | grep -qiE '^content-range: bytes 0-0/[0-9]{8,}' \
            || { echo "FATAL: asset pack not served at /data/openmw-web-assets.bsa" >&2; exit 1; }

      # Real end-to-end gate for the config THIS deploy controls: the shared edge (TLS with the origin
      # cert + sec_headers + reverse_proxy to the container). We hit the edge DIRECTLY via --resolve to
      # 127.0.0.1, bypassing Cloudflare — CF serves a bot challenge (cf-mitigated) to the runner's
      # headless curl, and CF's edge policy isn't what a deploy validates anyway. -k because the edge
      # presents the Cloudflare Origin CA cert (not a public CA). Catches what the container-only check
      # can't: a bad cert mount, a duplicate/conflicting COOP/COEP from the edge (silently kills
      # crossOriginIsolated), a proxy typo, a lost wasm MIME, or a broken launcher gate.
      - name: Health check (edge, bypassing Cloudflare)
        run: |
          set -e
          E() { curl -sS -k --resolve morrowind.virtastic.app:443:127.0.0.1 "$@"; }
          for i in $(seq 1 12); do
            E -o /dev/null https://morrowind.virtastic.app/ && break
            echo "edge not ready yet ($i)…"; sleep 3
          done
          E -D /tmp/h -o /dev/null https://morrowind.virtastic.app/
          echo "--- / headers (edge, pre-CF) ---"; cat /tmp/h
          # Each isolation header must appear EXACTLY ONCE. A duplicate — e.g. if the out-of-repo edge
          # `sec_headers` snippet also emits COOP/COEP — silently makes crossOriginIsolated false and
          # kills SharedArrayBuffer, yet a mere presence check (grep -q) passes on 1 OR 2 occurrences.
          for hdr in "cross-origin-opener-policy: same-origin" "cross-origin-embedder-policy: require-corp"; do
            n=$(grep -ci "^$hdr" /tmp/h)
            test "$n" = 1 || { echo "FATAL: header '$hdr' count=$n (want exactly 1)" >&2; exit 1; }
          done
          # Engine wasm is content-versioned under e/<hash>/. A bare /openmw.wasm 404s but STILL gets the
          # application/wasm stamp (Caddy's @wasm path matcher), so it can't be the probe. Discover the
          # stamped hash from index.html (fetch with a query so the launcher gate doesn't rewrite it) and
          # verify the REAL engine file serves 200 + the wasm MIME.
          E -o /tmp/idx "https://morrowind.virtastic.app/index.html?probe"
          VER=$(grep -oE '__ENGINE_VER = "[0-9a-f]{12}"' /tmp/idx | grep -oE '[0-9a-f]{12}' | head -1)
          test -n "$VER" || { echo "FATAL: no stamped engine hash found in index.html" >&2; exit 1; }
          WURL="https://morrowind.virtastic.app/e/$VER/openmw.wasm"
          code=$(E -o /dev/null -w '%{http_code}' "$WURL")
          test "$code" = 200 || { echo "FATAL: engine wasm $WURL returned HTTP $code" >&2; exit 1; }
          E -D - -o /dev/null "$WURL" | grep -qi '^content-type: *application/wasm'
          # "/" is the MULTIPLAYER SIGN-IN PAGE since 2026-10-12 (the gateway's front door, routed in
          # deploy/Caddyfile). It is served by openmw-mp, so it answers 302 /admin until that server
          # has restarted with setup completed -- which deploy-mp does, possibly after this job.
          # Accept either; anything else (a 404, a 5xx) is a broken front door.
          rc=$(E -o /tmp/front -w '%{http_code}' https://morrowind.virtastic.app/)
          case "$rc" in
            200) grep -q 'Sign in to play' /tmp/front || { echo "FATAL: / is not the sign-in page" >&2; exit 1; } ;;
            302) echo "note: / redirects to /admin until openmw-mp restarts with setup completed" ;;
            *) echo "FATAL: / returned HTTP $rc" >&2; exit 1 ;;
          esac
          E -f -o /dev/null "https://morrowind.virtastic.app/index.html?nomw"

          # Indexable posture. Google once indexed /index.html?nomw= as its own result, titled with
          # the engine's "Engine failed to load" overlay -- a crawler cannot run wasm, so the fatal
          # path is all it can render. The canonical is what folds every boot URL back into "/", so
          # losing it silently re-creates that failure. The launcher (now /launcher.html and the
          # /join door) and the game page must carry it, pointing at the bare root.
          E -o /tmp/root https://morrowind.virtastic.app/launcher.html
          for f in /tmp/root /tmp/idx; do
            grep -q '<link rel="canonical" href="https://morrowind.virtastic.app/">' "$f" || {
              echo "FATAL: canonical missing/wrong in $f" >&2; exit 1; }
          done
          grep -q '<meta name="description"' /tmp/root || {
            echo "FATAL: no meta description on the launcher" >&2; exit 1; }
          grep -q 'og:image" content="https://morrowind.virtastic.app/og.png"' /tmp/root || {
            echo "FATAL: no og:image on the launcher" >&2; exit 1; }
          # ...and the card it advertises has to exist. A 404 here is invisible until someone
          # shares the link and gets a bare text card.
          for u in og.png robots.txt sitemap.xml; do
            code=$(E -o /dev/null -w '%{http_code}' "https://morrowind.virtastic.app/$u")
            test "$code" = 200 || { echo "FATAL: /$u returned HTTP $code" >&2; exit 1; }
          done
          echo "edge health OK"

      # Refresh the edge cache for the HTML entry point after a deploy. The engine binaries are now
      # content-versioned (served from /e/<hash>/ with immutable, hash-unique names), so they NEVER need
      # purging — a new build lands at a new path. The only mutable document is index.html (served
      # no-cache and re-stamped to point at the current hash each build); purging it just guarantees the
      # edge hands out the fresh pointer immediately. Best effort: no-op unless CF_PURGE_TOKEN is set.
      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          # Reuses the org-level Cloudflare token (org secret CLOUDFLARE_API_TOKEN, scoped to this repo);
          # needs the Zone → Cache Purge permission. Missing/unpermitted → this step is a harmless no-op.
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 875c5c671fa7e246307b9f70d56fc6e1   # virtastic.app zone id (not secret)
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping edge purge (content-versioning makes this optional)."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" -H "Content-Type: application/json" \
            --data '{"files":[
              "https://morrowind.virtastic.app/",
              "https://morrowind.virtastic.app/index.html",
              "https://morrowind.virtastic.app/launcher.html",
              "https://morrowind.virtastic.app/og.png",
              "https://morrowind.virtastic.app/robots.txt",
              "https://morrowind.virtastic.app/sitemap.xml"
            ]}'
