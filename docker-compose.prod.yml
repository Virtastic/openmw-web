# Production compose for morrowind.virtastic.app — synced to /opt/morrowind/ on the OVH VPS.
# One static-serving container joined to the shared `nostalgia` docker network; the shared edge
# Caddy (nl-caddy) reaches it by name (morrowind:8080). Publishes NO host ports — only the edge
# talks to it. No database, no secrets → no env_file.
services:
  morrowind:
    image: morrowind:ovh            # built + tagged by the deploy workflow on the runner
    container_name: morrowind
    restart: unless-stopped
    networks: [shared]
    # journald instead of the default json-file: json-file logs are deleted when a deploy
    # recreates the container and grow without bound between deploys. journald persists
    # across recreations, rotates itself, and `docker logs morrowind` still works.
    logging:
      driver: journald
      options:
        tag: morrowind
    # The demo dataset is large and changes far less often than the engine. Mount it read-only
    # instead of rebaking the image each engine build. Place it at /opt/morrowind/data on the VPS.
    # (Remove this if you choose to bake the demo dataset into the image instead.)
    volumes:
      - /opt/morrowind/data:/srv/data:ro

networks:
  shared:
    external: true
    name: nostalgia
