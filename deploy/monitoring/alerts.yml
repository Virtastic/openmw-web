# OT3-140: page rules, Prometheus/Alertmanager format, vendor-neutral. Assumed scrape jobs:
#   omwmp      the server's /metrics            (OT3-133)
#   node       node_exporter on the same box    (OT3-133)
#   probe      blackbox_exporter http/ws probes (OT3-136)
# Every rule is severity=page and links its RUNBOOK.md section.
groups:
  - name: omwmp-page
    rules:
      - alert: ServerDown
        expr: up{job="omwmp"} == 0 or absent(up{job="omwmp"})
        for: 1m
        labels: { severity: page }
        annotations:
          summary: The game server is not answering /metrics scrapes.
          runbook_url: deploy/monitoring/RUNBOOK.md#serverdown

      - alert: ProcessRestarted
        # A crash that Docker restarts within seconds never shows as up == 0 (ServerDown).
        # Counters restart at 0 with the process, so a reset of one that is non-zero soon
        # after boot (a sim peer is spawned per region) marks a restart. A planned deploy
        # fires it too: silence it in Alertmanager for the deploy window.
        # TODO(metrics.ts owner): a process_start_time_seconds gauge would say this directly.
        expr: |
          resets(omwmp_simpeer_spawned_total{job="omwmp"}[10m]) > 0
          or increase(omwmp_server_crashes_total{job="omwmp"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: The game server process restarted in the last 10 min (crash or deploy).
          runbook_url: deploy/monitoring/RUNBOOK.md#processrestarted

      - alert: SimPeerCrashing
        # The supervisor restarts a crashed peer, so one crash is a ticket's worth; repeated
        # crashes mean a region's NPCs keep freezing for everyone in it.
        expr: increase(omwmp_simpeer_crashed_total{job="omwmp"}[15m]) >= 3
        labels: { severity: page }
        annotations:
          summary: Sim peers crashed {{ $value | humanize }} times in 15 min.
          runbook_url: deploy/monitoring/RUNBOOK.md#simpeercrashing

      - alert: PeerFrameSlow
        # 50 ms is the peer's frame pace; a p99 over it for 5 min slows sim time in the region.
        expr: omwmp_peer_frame_interval_ms{job="omwmp",quantile="0.99"} > 50
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Region {{ $labels.region }} peer frame p99 {{ $value | humanize }} ms for 5 min.
          runbook_url: deploy/monitoring/RUNBOOK.md#peerframeslow

      - alert: EventLoopStalled
        expr: omwmp_event_loop_delay_p99_seconds > 0.1
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Event-loop p99 {{ $value | humanizeDuration }} for 5 min; every player feels it.
          runbook_url: deploy/monitoring/RUNBOOK.md#eventloopstalled

      - alert: PersistFlushFailed
        expr: increase(omwmp_persist_flush_failed_total[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: A persistence flush threw (store {{ $labels.store }}); progress may not be saving.
          runbook_url: deploy/monitoring/RUNBOOK.md#persistflushfailed

      - alert: SessionsCollapsed
        # More than half the players gone in a minute, from a base big enough to mean it.
        expr: |
          omwmp_sessions_in_world < 0.5 * (omwmp_sessions_in_world offset 1m)
          and (omwmp_sessions_in_world offset 1m) >= 6
        labels: { severity: page }
        annotations:
          summary: In-world sessions fell by half in one minute.
          runbook_url: deploy/monitoring/RUNBOOK.md#sessionscollapsed

      - alert: ProbeDown
        # 1/min probes (OT3-136): two failed in a row. With scrape and evaluation delay this
        # pages about 2 min after the site stops answering (the OT3-136 acceptance gate).
        expr: probe_success{job="probe"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.instance }} ({{ $labels.check }}) failed its outside probe twice running.'
          runbook_url: deploy/monitoring/RUNBOOK.md#probedown

      - alert: DiskLow
        # Prod filled to 0 bytes on 2026-10-23 and every deploy died.
        expr: |
          node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"} < 0.15
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.mountpoint }} below 15% free.'
          runbook_url: deploy/monitoring/RUNBOOK.md#disklow

      - alert: BackupStale
        expr: omwmp_backup_age_seconds > 7200
        labels: { severity: page }
        annotations:
          summary: No good SQLite backup for over 2 h.
          runbook_url: deploy/monitoring/RUNBOOK.md#backupstale

      - alert: BackupNeverRan
        # -1 = no good backup since the process started; a fresh process gets 2 h.
        expr: omwmp_backup_age_seconds == -1
        for: 2h
        labels: { severity: page }
        annotations:
          summary: No good SQLite backup for over 2 h.
          runbook_url: deploy/monitoring/RUNBOOK.md#backupstale

  # Not pages: a silent prober means ProbeDown can no longer fire, which someone should fix
  # in working hours.
  - name: omwmp-probe-health
    rules:
      - alert: ProberSilent
        expr: absent(probe_success{job="probe"})
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: No outside probe results for 10 min; the prober outside OVH is down or not sending.
          runbook_url: deploy/monitoring/RUNBOOK.md#probersilent
