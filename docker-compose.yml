#
# SELF-HOSTING STACK. Run ./setup.sh (macOS/Linux) or .\setup.ps1 (Windows) and it will
# bring this up for you, or `docker compose up -d` if you prefer doing it by hand. Then
# open the admin dashboard and the setup wizard walks you through the rest.
#
# This is NOT how morrowind.virtastic.app is deployed. That uses docker-compose.prod.yml
# and infra/, which assume a shared edge proxy, prebuilt CI images and a specific VPS —
# copying them for your own box will not work. This file is the one for you.
#
# WHAT RUNS HERE
#   openmw-web  the server itself, and the admin dashboard at /admin
#   caddy       HTTPS in front of it (automatic certificates when you have a domain)
#
# WHAT DOES NOT RUN HERE
#   The game client itself. Players do not install anything — they open the web client in
#   a browser and type in your server's address. Building the client from source needs a
#   ~13 minute WebAssembly compile and a prepared toolchain image, so it is not part of a
#   "get running in two minutes" setup. Point your players at whichever copy of the client
#   you use; the server is the part you host.

services:
  openmw-web:
    # BUILT LOCALLY. Nothing is pulled from a registry and nothing is published.
    #
    # Two images are possible here and they are not interchangeable:
    #
    #   server/Dockerfile            (this one) builds in about a minute. The server, the
    #                                admin dashboard, everything except a compiled OpenMW.
    #                                Without that engine it cannot simulate a world, so it
    #                                serves the dashboard and refuses players — which is
    #                                exactly what you want while setting things up.
    #
    #   server/Dockerfile.simpeer    --target tier2, from the repo root. Same server plus a
    #                                headless OpenMW compiled from source, which is what
    #                                actually lets players in. That compile is long and
    #                                memory-hungry; see the notes in that file.
    #
    # Start with this one. Switch the build block below to the simpeer file when you want a
    # world people can actually join.
    build:
      context: ./server
      dockerfile: Dockerfile
    image: openmw-web:local
    container_name: openmw-web
    # The image's own default starts the multi-world gateway, which is how the hosted
    # platform runs. A self-hosted box wants one world, so this entrypoint picks the mode
    # from <data>/.mode instead. Switching is deliberately NOT a dashboard control: the
    # dashboard administers a world, and the gateway does not have one of its own, so a
    # button that flips this would sign you out of the thing you flipped it with. Write
    # "gateway" into <data>/.mode by hand and restart if you really run multi-world.
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: []
    # THIS IS WHAT MAKES THE DASHBOARD'S RESTART BUTTON WORK. The server exits cleanly on
    # SIGTERM and Docker starts it again; without this policy the button would stop the
    # server and leave the operator with no way to bring it back from a browser.
    restart: unless-stopped
    volumes:
      # Everything that must survive: accounts, characters, world state, the settings the
      # dashboard writes, and logs.
      - ./data:/data
      # YOUR OWN MORROWIND FILES. Copy Morrowind.esm/.bsa (and Tribunal/Bloodmoon if you
      # own them) into ./gamedata next to this file, or upload them through the dashboard.
      #
      # Writable, which is a deliberate change from read-only: uploading is the only route
      # onto this box for someone who does not have a shell on it, and that is most of the
      # people this setup is for. Nothing writes here except an upload you asked for; the
      # mod list changes load order without touching the files. Add ":ro" back if you would
      # rather copy files in yourself — the dashboard detects it and says so instead of
      # failing with a permissions error.
      - ./gamedata:/data/gamedata
    environment:
      - NODE_ENV=production
      # Object storage keys, ONLY as a fallback. The setup wizard asks for these in the
      # browser and stores them with the rest of your settings, which is the path a
      # self-hoster should use. These variables stay supported for deployments that inject
      # credentials from outside (the hosted platform does); a value set in the dashboard
      # wins over them.
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # Unfinished features the setup wizard will otherwise show greyed out. Comma separated,
      # from: multiplayer, playerUploads. "all" turns on both. playerUploads is the delivery
      # answer where each player uploads their own copy of the game here.
      #
      #   OMW_EXPERIMENTAL=multiplayer docker compose up -d
      #
      # or put OMW_EXPERIMENTAL=multiplayer in a .env file beside this one. This only decides
      # what a NEW setup may choose; a server already configured for any of them keeps working
      # whatever this says.
      - OMW_EXPERIMENTAL=${OMW_EXPERIMENTAL:-}
      # The data-chooser launcher at /. Off by default: a configured server boots straight
      # into sign-in and the game. OMW_ENABLE_LAUNCHER=1 puts the chooser back.
      - OMW_ENABLE_LAUNCHER=${OMW_ENABLE_LAUNCHER:-}
    expose:
      - "8080"
    # Ports are published by Caddy, not here, so the server is only reachable over HTTPS.
    # To run without Caddy (a trusted LAN, or your own proxy in front), comment out the
    # caddy service below and uncomment this:
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Keep the last few log files rather than growing without bound. The server also writes
    # its own rotated log to data/logs/server.log, which survives the container being
    # recreated — that is the copy to read after a crash.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: openmw-web-caddy
    restart: unless-stopped
    depends_on:
      - openmw-web
    ports:
      - "80:80"
      - "443:443"
    # --watch reloads when the config file changes, which is what lets the dashboard set up
    # HTTPS by itself: the wizard writes the file, Caddy picks it up within a second or two,
    # and a certificate is issued. No .env to hand-edit, no compose command to run.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--watch"]
    volumes:
      # GENERATED BY THE SERVER into its own data directory, which is the one place both
      # containers share. Read-only here: Caddy consumes this file, the dashboard owns it.
      - ./data/caddy:/etc/caddy:ro
      # THE PLAYER APP, which is in this repo already: play/ holds launcher.html, the game
      # page and the compiled engine. This used to mount ./client, a directory the repo does
      # not contain, so `docker compose up` produced a server that could never serve anyone a
      # playable client and a landing page that said the game was not installed — after the
      # operator had just uploaded the game.
      #
      # Same hostname as the server, which multiplayer REQUIRES: the page will not hand its
      # session ticket to a different host. Read-only, and the Caddyfile refuses the
      # development-only paths inside it (see caddy-config.ts).
      - ./play:/srv/client:ro
      # Certificates and account keys. Losing this means re-issuing certificates on every
      # restart, which Let's Encrypt rate-limits — so it is a named volume, not a temp dir.
      - caddy-data:/data
      - caddy-config:/config
    # No SERVER_DOMAIN/TLS_MODE variables any more: the domain is an answer in the setup
    # wizard, stored with every other answer, and rendered into the config above. Asking a
    # non-technical operator to edit a dotfile next to this one was where setup used to stop.

volumes:
  caddy-data:
  caddy-config:
