#
# SELF-HOSTING STACK. Run ./setup.sh (macOS/Linux) or .\setup.ps1 (Windows) and it will
# bring this up for you, or `docker compose up -d` if you prefer doing it by hand. Then
# open the admin dashboard and the setup wizard walks you through the rest.
#
# This is NOT how morrowind.virtastic.app is deployed. That uses docker-compose.prod.yml
# and infra/, which assume a shared edge proxy, prebuilt CI images and a specific VPS —
# copying them for your own box will not work. This file is the one for you.
#
# WHAT RUNS HERE
#   openmw-mp   the multiplayer server, and the admin dashboard at /admin
#   caddy       HTTPS in front of it (automatic certificates when you have a domain)
#
# WHAT DOES NOT RUN HERE
#   The game client itself. Players do not install anything — they open the web client in
#   a browser and type in your server's address. Building the client from source needs a
#   ~13 minute WebAssembly compile and a prepared toolchain image, so it is not part of a
#   "get running in two minutes" setup. Point your players at whichever copy of the client
#   you use; the server is the part you host.

services:
  openmw-mp:
    # A PUBLISHED IMAGE, not a local build, and the reason matters.
    #
    # The server runs its own headless copy of the OpenMW engine to simulate NPCs, and
    # refuses to start without it. That binary is compiled from the engine source in this
    # repo — a long build that wants a lot of memory — so making every self-hoster do it
    # would turn "running in two minutes" into an afternoon, on a machine that may not have
    # the RAM for it. The release workflow builds it once and publishes it here.
    #
    # `build` is kept as a fallback: if the registry is unreachable or you are running a
    # modified checkout, `docker compose build` produces the same image locally. Expect it
    # to take a while.
    image: ghcr.io/virtastic/openmw-mp:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: server/Dockerfile.simpeer
      target: tier2
    container_name: openmw-mp
    # The image's own default starts the multi-world gateway, which is how the hosted
    # platform runs. A self-hosted box wants one world, so this entrypoint picks the mode
    # from <data>/.mode instead — and the dashboard can switch between them with a restart.
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: []
    # THIS IS WHAT MAKES THE DASHBOARD'S RESTART BUTTON WORK. The server exits cleanly on
    # SIGTERM and Docker starts it again; without this policy the button would stop the
    # server and leave the operator with no way to bring it back from a browser.
    restart: unless-stopped
    volumes:
      # Everything that must survive: accounts, characters, world state, the settings the
      # dashboard writes, and logs.
      - ./data:/data
      # YOUR OWN MORROWIND FILES. Copy Morrowind.esm/.bsa (and Tribunal/Bloodmoon if you
      # own them) into ./gamedata next to this file. Read-only: the server never modifies
      # your game data. The dashboard's mod list controls load order without touching them.
      - ./gamedata:/data/gamedata:ro
    environment:
      - NODE_ENV=production
      # Object storage for player uploads, if you chose S3 in the setup wizard. Keys live
      # in .env next to this file, never in the config the dashboard writes — so a settings
      # backup can never carry your credentials.
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    expose:
      - "8080"
    # Ports are published by Caddy, not here, so the server is only reachable over HTTPS.
    # To run without Caddy (a trusted LAN, or your own proxy in front), comment out the
    # caddy service below and uncomment this:
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Keep the last few log files rather than growing without bound. The server also writes
    # its own rotated log to data/logs/server.log, which survives the container being
    # recreated — that is the copy to read after a crash.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: openmw-mp-caddy
    restart: unless-stopped
    depends_on:
      - openmw-mp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The game client's static files, if you are serving them yourself. Unpack a release
      # zip into ./client and Caddy serves it at / while the server keeps /admin and the
      # rest — same hostname, which multiplayer REQUIRES (the page will not hand its session
      # ticket to a different host). Leave it empty to run server-only.
      - ./client:/srv/client:ro
      # Certificates and account keys. Losing this means re-issuing certificates on every
      # restart, which Let's Encrypt rate-limits — so it is a named volume, not a temp dir.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Set SERVER_DOMAIN in .env once you have a domain pointed at this machine and Caddy
      # will get a real certificate automatically. "localhost" means no domain: Caddy then
      # serves a certificate it signed itself, which works but makes browsers warn once.
      #
      # The default is "localhost" rather than empty ON PURPOSE. Caddy's {$VAR:default}
      # falls back only when a variable is UNSET, and compose sets it either way — so an
      # empty value reached the Caddyfile as an empty site address, which is a syntax error
      # ("server block without any key"). Found by running the stack; it looks fine on paper.
      - SERVER_DOMAIN=${SERVER_DOMAIN:-localhost}
      # Empty when a domain is set (so Let's Encrypt issues a public certificate), and
      # "tls internal" when there is none. See the Caddyfile for why this is a variable.
      - TLS_MODE=${TLS_MODE:-tls internal}

volumes:
  caddy-data:
  caddy-config:
